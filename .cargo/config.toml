[alias]
# Keep the verifier/bootstrap binary outside the measured Cargo target. This makes a true cold
# receipt possible: the verifier starts before application/test compilation has populated /target.
xtask = "run --target-dir .vigil-tools-target -p xtask --"
test-first-light = "nextest run --release --profile ci-full --workspace --features first-light-acceptance,acceptance -E=binary(first_light_loop)"
test-acceptance = "nextest run --release --profile ci-full --workspace --features first-light-acceptance,acceptance -E=binary(acceptance)"
test-ci-full = "nextest run --release --profile ci-full --workspace --features first-light-acceptance,acceptance"

[target.x86_64-unknown-linux-musl]
linker = "target/vigil-test-tools/zig/rust-lld-x86_64-linux-musl"
rustflags = ["-Clinker-flavor=ld.lld"]

[target.aarch64-unknown-linux-musl]
linker = "target/vigil-test-tools/zig/rust-lld-aarch64-linux-musl"
rustflags = ["-Clinker-flavor=ld.lld"]

[env]
CC_x86_64_unknown_linux_musl = { value = "target/vigil-test-tools/zig/zig-cc-x86_64-linux-musl", relative = true }
CXX_x86_64_unknown_linux_musl = { value = "target/vigil-test-tools/zig/zig-cxx-x86_64-linux-musl", relative = true }
CXXSTDLIB_x86_64_unknown_linux_musl = "c++"
CC_aarch64_unknown_linux_musl = { value = "target/vigil-test-tools/zig/zig-cc-aarch64-linux-musl", relative = true }
CXX_aarch64_unknown_linux_musl = { value = "target/vigil-test-tools/zig/zig-cxx-aarch64-linux-musl", relative = true }
CXXSTDLIB_aarch64_unknown_linux_musl = "c++"
