# docs/configuration.md:448
[[claim]]
id = "vigil.docs-configuration.the-one-documented-exception-is-vigil-detector-queue-capacity"
document = "docs/configuration.md"
paragraph_sha256 = "sha256:cde11523ea269a5c8aa7e21cd75848c57e20df646c6d6073a34eb31385c26fc9"
evidence_tier = "acceptance"
tests = [
  "vigil-bin::settings_queue_capacity_environment_attribution_live::a_cameraless_node_still_names_the_lever_that_supplied_its_queue_depth",
  "vigil-bin::settings_queue_capacity_environment_attribution_live::an_unpinned_node_shadows_the_depth_vigil_chose_for_itself_not_an_operator_pin",
  "vigil-bin::settings_queue_capacity_environment_attribution_live::the_queue_depth_a_camera_node_reports_names_its_lever_from_the_first_moment_it_can_be_asked",
]
reviewed = true
reviewed_by = "Wave-15 closeout documentation pass, 2026-08-17"
rationale = "Read the paragraph sentence by sentence against all three named tests. That the surface attributes the in-force capacity to the variable rather than reporting it as ignored or as the stored value is held by all three: each spawns a real vigil run carrying VIGIL_DETECTOR_QUEUE_CAPACITY=3 and asserts running=3 on the detector_queue_capacity line read back through a separate vigil settings process that does not itself carry the variable. That it does so from the first moment the surface can be asked is held by construction rather than by wording: all three ask the instant the control socket accepts a connection, with no sleep and no retry, so a rendering that only became true later would fail. That it holds on a node with no cameras configured is held by a_cameraless_node_still_names_the_lever_that_supplied_its_queue_depth, which runs the same assertions against a cameras = [] deployment. The two named tokens are asserted by their declared spellings imported from settings_projection. The shadowed-setting sentence now states both halves of what the projection key promises, and each half has its own test. Where the operator pinned a depth, the token carries that pin: the two pinned arms configure detector_queue_capacity = 1 against a lever of 3, so a line echoing the lever back at itself as the shadowed value cannot pass. Where they pinned nothing, the token carries the depth Vigil chose for itself: an_unpinned_node_shadows_the_depth_vigil_chose_for_itself_not_an_operator_pin runs a deployment whose configuration does not name the setting at all -- asserted before the run starts -- and requires the token to carry settings_backends::AUTOMATIC_DETECTOR_QUEUE_CAPACITY, imported rather than written out. This replaces the wave-15 registration review's narrowing of the paragraph, whose stated reason was wrong: the shipped code does render the token on an unpinned node, because the value it compares the lever against is detector_queue_capacity_in_force, which falls back to the automatic depth when nothing is pinned. Only the two pinned arms existed then, so nothing in the estate could show it, and the paragraph was narrowed to a claim the code does not make -- that the token is always the operator's own stored pin -- which is the documentation gap this pass closes."

