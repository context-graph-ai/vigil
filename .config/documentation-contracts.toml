# docs/configuration.md:347
[[claim]]
id = "vigil.docs-configuration.the-addon-schema-accepts-optional-decodeprobedeadlinesecs"
document = "docs/configuration.md"
paragraph_sha256 = "sha256:d2036b08aedea448625af1f62e4c139ddfe29c220082261f57144319aacba416"
evidence_tier = "integration"
tests = [
  "vigil::detection_preparation_outcomes_reach_every_surface::a_completed_preparation_promotes_and_the_same_account_reaches_every_surface",
  "vigil::detection_preparation_outcomes_reach_every_surface::a_preparation_still_working_is_never_ended_for_it",
  "vigil::detection_preparation_promotes_when_it_completes::a_preparation_under_way_is_reported_as_such_and_promotes_when_it_completes",
  "vigil::probe_deadline_knob_surface::addon_config_declares_the_decode_probe_sample_wait_as_an_optional_integer",
  "vigil::probe_deadline_knob_surface::addon_help_documents_decode_probe_deadline_option",
  "vigil::probe_deadline_knob_surface::the_decode_probe_sample_wait_defaults_to_the_documented_number_of_seconds",
  "vigil::probe_timer_removal::neither_detection_timer_is_offered_as_an_add_on_option",
]
reviewed = true
reviewed_by = "Independent semantic-mapping review, 2026-08-15"
rationale = "Independent review read the paragraph sentence by sentence against every named test and confirms each is honestly held. That the schema accepts the option and that it is optional is held by addon_config_declares_the_decode_probe_sample_wait_as_an_optional_integer, which asserts the schema declares it int? and that it is absent from the default options block so leaving it unset keeps the source default. The documented default of 5 is bound at both ends: addon_help_documents_decode_probe_deadline_option asserts the shipped operator help names a 5-second default for this option, and the_decode_probe_sample_wait_defaults_to_the_documented_number_of_seconds asserts the value a deployment resolves with nobody having set it is that same number, read off the setting itself against the documented one. That the option bounds a stream session gathering real video before it chooses a decode path, and not normal frame processing, is held at the operator surface by the same help test, which requires the description to say the knob is a probe wait ending in a fallback; the negative half of that sentence has no test of its own and was confirmed by reading the source instead - the resolved value is consumed at exactly one site, the startup probe drain at decode_gstreamer.rs:178, resolved once at runtime.rs:452-470, and reaches no frame-processing path. That detection offers no equivalent is held by neither_detection_timer_is_offered_as_an_add_on_option, and that a preparation ends only on its own outcome by a_preparation_still_working_is_never_ended_for_it, which reads the surface repeatedly while the preparation is demonstrably unfinished and sees it stay Preparing with no failure classification. The closing sentence is held by the two tests bound to it: a_preparation_under_way_is_reported_as_such_and_promotes_when_it_completes asserts the receipt carries both when the preparation began and the last thing it reported about itself and that completion swaps the detector live onto the accelerated backend, and a_completed_preparation_promotes_and_the_same_account_reaches_every_surface asserts the health and statistics surfaces both name the accelerated backend and agree with each other. Superseded mapping note - the earlier list bound the whole paragraph to three tests that held only its first three sentences. The paragraph's closing sentence - that the surfaces report a preparation under way, since when, and the last thing it reported, and that on completion the detector is swapped live and every surface moves together - is now bound to the two tests that hold it: a_preparation_under_way_is_reported_as_such_and_promotes_when_it_completes for preparing-since and latest progress, and a_completed_preparation_promotes_and_the_same_account_reaches_every_surface for the surfaces moving together. The default of 5 is bound at both ends: addon_help_documents_decode_probe_deadline_option asserts the shipped operator help names a 5-second default for this option, and the_decode_probe_sample_wait_defaults_to_the_documented_number_of_seconds asserts the value a deployment resolves with nobody having set it is that same number, read off the setting itself against the documented one."

