rationale = "The paragraph promises one greppable line per delivery attempt naming how it resolved, and both named tests read exactly that line rather than inferring from an absence: the unreachable-hub arm requires the settled line and the failed outcome beside its named error, and the two-process arm requires the hub — whose own writes are canonical — to record that no push was attempted, which is a different fact from a push that succeeded. Both GREEN at this tuple (w13vgred-run-16)."

[[claim]]
