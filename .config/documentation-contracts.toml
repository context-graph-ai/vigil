[[claim]]
id = "vigil.docs-architecture.a-node-serves-the-fleet-as-soon"
document = "docs/architecture.md"
paragraph_sha256 = "sha256:7f6c98f6bfb2b5f1dcdf6759864c9ae779af781c061375b8926deab75fe8a909"
evidence_tier = "behavioral_unit"
tests = [
  "vigil-bin::cameraless_worker::cameraless_worker_without_a_loadable_model_does_not_advertise_and_reports_no_model",
  "vigil-bin::cameraless_worker::detector_job_registers_as_vigil_detector_class_slot_populates_without_a_camera",
  "vigil::fabric::worker_detector_slot_tests::a_detector_that_arrives_before_anything_waits_still_starts_exactly_one_worker",
  "vigil::fabric::worker_detector_slot_tests::an_operator_stop_settles_a_waiting_start_and_nothing_starts_after_it",
]
reviewed = true
reviewed_by = "Semantic-mapping review by the window-13 test author, 2026-08-25 — the author of the bound tests, NOT an independent reviewer: each assertion in the paragraph was traced to a named test that runs it, and the run state of every one is cited below. Commission an independent pass if this mapping is load-bearing."
rationale = "Every sentence of the paragraph has a test that runs it. That the worker loop starts the moment a detector arrives whichever way the order falls is the slot pair: one publishes before anything waits and still starts exactly one worker, the other has the operator stop settle a start that is still pending so a detector finishing during teardown starts nothing. That a real node reaches that state, and that a node with no loadable model advertises nothing and says why instead, are the two cameraless arms over a real process. Nothing here is judged by elapsed time, which is the paragraph's own claim and the standing owner ruling of 2026-08-14. All four run GREEN at this tuple (steps w13vgred-flip-2 and the implementation run that landed the slot pair)."

