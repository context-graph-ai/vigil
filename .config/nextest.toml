[profile.default]
default-filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.pr]
default-filter = 'not (binary(first_light_loop) | binary(acceptance))'
fail-fast = false
retries = 0
test-threads = 2
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci-full]
default-filter = 'all()'
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
test-threads = 1

[[profile.ci-full.overrides]]
filter = 'binary(first_light_loop) | binary(acceptance)'
slow-timeout = { period = "180s", terminate-after = 4 }
