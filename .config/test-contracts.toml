[[contract]]
id = "camera-identity-per-source-kind-fallible-canonicalising-constructors"
lineage = "CameraId::new accepted any string, so parallel source lanes (native RTSP, USB/UVC, CSI-2, HTTP/MJPEG) could each invent a mutually incompatible identity scheme for the same physical camera with nothing to notice a disagreement. Four per-source-kind constructors make the durable-identity rule structural: CameraId::from_usb/from_csi take the owning node plus a durable hardware identity (vendor/product/serial for USB, module identity for CSI), refusing an empty value or a transient /dev/-style path rather than accepting a bad identity; CameraId::from_rtsp_url/from_mjpeg_url take the owning node plus the camera's endpoint URL, refusing a value that does not parse as an absolute URL with an allowed scheme (rtsp/rtsps; http/https). Canonicalisation is decided per kind and pinned by name: a URL identity keeps scheme, host (case folded), port (the RTSP default port 554 and the HTTP/HTTPS default ports normalised so an absent port and the explicit default collapse together), PATH, and QUERY — both are significant, not incidental, because two MJPEG cameras behind one NVR/hub at different paths (e.g. http://host/cam1 vs http://host/cam2) are the ordinary deployment, and a real NVR distinguishes channels by query (e.g. ?channel=1); only userinfo (a `user:pass@` credential) is stripped structurally, and the documented consequence is pinned directly: a rotating query-carried token rotates identity, so credentials belong in the entry's username/password fields, never the URL. A hardware identity is only whitespace-trimmed and explicitly keeps case (a USB/CSI serial can be genuinely case-sensitive, unlike a DNS host name, so folding it would risk collapsing two distinct devices). Every constructor scopes the result to the owning node, so the identical device/endpoint declared on two different nodes never collides into one camera. Role congruence (a camera declared with both an analysis stream `rtsp_url` and a separate live stream `live_rtsp_url` being ONE camera) is an ENTRY-level property, not a URL-level one — an entry's identity derives from its analysis endpoint alone, and `live_rtsp_url` never participates (pinned in the sibling `camera-config-schema-single-source-kind-and-honest-refusal` contract's duplicate-detection tests); at the raw-URL level pinned here, two distinct paths on the same host/port are two distinct camera ids, reversing the prior design that bought role congruence by discarding the path and thereby silently dropped a second, real, differently-pathed camera behind the same host."
sources = [
  "crates/vigil/tests/camera_identity_construction.rs",
]
evidence_kind = "behavioral-unit"
gate = "pull-request"
