id = "camera-hub-producer-consumer-split-is-structural"
lineage = "The camera-track hub's publish and begin_epoch move off the single, shared CameraTrackHub type onto a distinct producer handle taking &mut self, so a second producer for the same track cannot be expressed by holding a shared reference; the consumer side keeps subscribe/detach/its query surface, stays Clone, and every clone observes the identical live producer state — a begin_epoch bump made through the producer is visible through a consumer clone made before OR after the bump, and a subscription made through one clone receives the identical Arc<EncodedAccessUnit> a subscription made through another clone receives for the same publish. The producer is provably a genuinely separate, singly-owned handle: it can be moved onto its own thread (mirroring a real source supervisor owning it there) while consumer clones stay usable on the caller thread. The three type-level guarantees the behavioral tests above cannot exercise — CameraTrackHubProducer is not Clone, no method on the consumer mints a producer, and &mut self specifically (not merely !Clone) is what blocks concurrent publication — are CLOSED by three compile_fail doctests beside CameraTrackHubProducer in camera_hub.rs, following the SettingHandle/AutomationHandle precedent in src/settings.rs, each verified genuinely fix-dependent by temporarily relaxing the real constraint and confirming the doctest then compiles before reverting; camera_hub_capability_scan.rs is the lexical backstop (mirroring automation_handle_capability_scan.rs's core impl-block-scanning mechanism, not its full alias-detection sophistication) that re-checks the two of the three a future edit could reopen without any doctest noticing."
