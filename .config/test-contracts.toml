[[contract]]
id = "camera-hub-async-recv-and-explicit-terminal-events"
lineage = "Subscription gains an async recv() alongside the existing synchronous drain(), so a consumer can await the next event instead of busy-polling — proven waker-driven and deterministic (poll, assert Pending and no wakeup, publish, assert the waker actually fired, poll again and assert the exact Ready value; never a sleep or a wall-clock deadline). Three terminal conditions are explicit and mutually distinguishable: CameraTrackHubProducer::end_source (the source closed normally), CameraTrackHubProducer::abandon_source (supervision abandoned the source after exhausting retries), and CameraTrackHub::shutdown (the hub itself going away) each raise their own SubscriptionEnd variant, proven distinct from one another and from the pre-existing per-subscriber FaultOnGap overflow TrackEvent::Fault. The load-bearing subtlety: a transient fault followed by a producer reconnect (begin_epoch) is proven NOT terminal across two successive retries — recv keeps yielding Track events into each new epoch, including the immediately-available retained codec configuration begin_epoch sets eagerly, and only an explicit abandon_source call ever raises SourceFault. Ordering is proven exactly: every TrackEvent already buffered for a subscription is delivered before its terminal, even when the terminal was raised before anything drained. The terminal is proven exactly-once and non-resurrecting: once yielded, every later recv() call — including on a fresh Subscription::recv() future, not merely a re-poll of the same one — resolves immediately to None across repeated calls, and abandon_source's own reason is proven to be the FIRST raised terminal's, unmodified by a later call with a different reason. The recv()/SubscriptionEnd/SubscriptionEvent/end_source/abandon_source/shutdown signatures this contract exercises live in crates/vigil/src/camera_hub.rs alongside the pre-existing publish/begin_epoch/drain surface the sibling `camera-hub-bounded-fanout-loss-contract-and-epochs` contract already owns; this contract's OWN registered tests are every one only in the test file below. Widened (RED, independent-review defects, not yet fixed): a terminal must reach a subscriber that joins AFTER end_source/shutdown already fired, and publish/begin_epoch must be refused once any terminal has fired (begin_epoch now returns Result<u64, PublishError> with a new PublishError::ProducerEnded(SubscriptionEnd) variant); a FaultOnGap coverage fault must be terminal under recv(), not only drain(); CameraTrackHub::detach must wake a parked recv() waker instead of dropping it; and a password-shaped SourceFault reason must never reach Debug output. Independent review found `raise_terminal` did not check `detached`, so a hub-wide terminal raised in the window between a FaultOnGap overflow and that subscriber's own next poll produced a second terminal; fixed by skipping already-detached subscribers, pinned by `a_hub_wide_terminal_raised_between_a_fault_on_gap_overflow_and_its_next_poll_never_yields_a_second_terminal`, which — unlike the pre-existing `a_detached_fault_on_gap_subscription_never_yields_a_second_terminal_after_a_later_hub_wide_terminal` — raises the hub-wide terminal BEFORE the detached subscriber's own first post-fault poll, the actual racy ordering. Separately, `a_waker_invoked_from_inside_publish_can_safely_touch_the_hub_without_deadlocking`'s liveness-by-bounded-spin evidence (200,000 cooperative yields on a spawned thread) was replaced by a deterministic unit-level `try_lock` assertion — `a_waker_invoked_from_inside_publish_finds_the_hub_state_lock_already_released`, in crates/vigil/src/camera_hub.rs's own `#[cfg(test)] mod tests`, the only place with access to the hub's private internal Mutex — proving the lock is genuinely released before any waker runs, with no thread and no spin."
sources = [
  "crates/vigil/src/camera_hub.rs",
  "crates/vigil/tests/camera_hub_fanout.rs",
]
