[[contract]]
id = "camera-hub-bounded-fanout-loss-contract-and-epochs"
lineage = "The camera-track hub is bound at CONSTRUCTION to one stream, camera, source role, AND codec — never adopted from whatever unit happens to publish first (proven for all four bound values individually, including as the very first publish a fresh hub ever sees), so a wrong-identity rejection means something. It fans one publish out to N subscribers over the identical shared buffer; each subscriber declares its own loss contract (RejoinAtRandomAccess or FaultOnGap) and an optional explicit capacity (unset genuinely resolves to the automatic default derived from the stream's effective keyframe interval — proven by an EXACT fill at that bound and an EXACT FaultOnGap overflow boundary, never a `<=`-only check a do-nothing implementation would also satisfy, and never a parallel constant); queues are bounded with no unbounded growth, including the one event class that is never droppable (codec configuration), which is bounded/coalesced to the latest value rather than accumulating one entry per undrained epoch bump; a stalled/failed subscriber, an explicit detach, and a dropped Subscription handle are all detached without disturbing the producer or any other subscriber; a join lands on codec-config-then-keyframe (proven against a hub that retains nothing, by publishing the post-join keyframe with no codec_config of its own) and deterministically requests a producer keyframe (a dirty-flag signal that is also proven to be consumed on read, not sticky); a capacity-one subscriber, joined strictly BEFORE its keyframe is published, still receives both because codec configuration and faults sit outside the capacity budget; reconnect/format-change/discontinuity (all three EpochReason variants) each open a new epoch under a stable stream identity while resetting sequence numbering, discarding the prior epoch's retained data, and marking the new epoch's own first delivered unit's discontinuity/format_change regardless of what the producer authored; the exact lost range on a FaultOnGap overflow is proven at the FIRST lost sequence, not one extended past it, both for an explicit capacity and for the automatic default; and publish refuses a unit whose stream/epoch/camera/source-role/codec identity is wrong, not only a duplicate sequence."
