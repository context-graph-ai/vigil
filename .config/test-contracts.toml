id = "camera-config-schema-single-source-kind-and-honest-refusal"
lineage = "Driven through the real production config loader: one [[cameras]] entry declares exactly one source kind (native RTSP — rtsp:// or rtsps://, USB, CSI, or MJPEG), classified through the REAL four-outcome FieldOutcome path (Omitted/Empty/Invalid/Unavailable, each distinct — an operator who typed an empty value gets different text than one who never touched the field, and a malformed value gets different text than a well-formed one this artifact merely cannot carry); missing/empty/invalid/conflicting source fields are actionable camera-named errors; USB/CSI identity is durable-hardware-identity-keyed (rejecting a transient /dev/ device path as Invalid) with a display-only name; scheme validation accepts every scheme a real camera actually serves (rtsp AND rtsps for RTSP-over-TLS, http AND https for MJPEG) and refuses only a value that is not a URL at all; MJPEG/RTSP credentials never leak into an error message whether carried on the separate password field, embedded in a well-formed URL's userinfo (redacted to <redacted>@host, keeping the actionable host/path), embedded in a scheme-relative/bare-authority value that fails to parse as a URL at all (refused as Invalid with NO echo whatsoever, closing the redaction bypass a naive scheme://-only check left open), or carried in a URL's QUERY STRING with no userinfo at all (a common shape for a stream token, e.g. ?token=..., stripped unconditionally from ERROR TEXT — a separate concern from CameraId's own canonical-endpoint identity, which keeps the query); a malformed TOML file reports only a static category plus line/column, never anything derived from the error itself (not even its own bare message, which for a typed-deserialization failure can embed the offending scalar); and every well-formed adapter kind is honestly rejected unsupported_by_this_artifact (never conflated with Invalid) because no capture/encode lane exists yet, proven end to end through the same Result vigil run itself would get. An explicitly empty [[cameras]] list (a deliberate, legitimate cameraless node) produces no legacy single-camera synthesis, while an absent cameras field keeps that legacy synthesis unchanged; and a source kind this artifact cannot carry is refused identically whether it arrives through a [[cameras]] table entry or through the equivalent legacy --usb-device/--csi-module/--mjpeg-url CLI flag, never silently accepted on one route while the other honestly refuses it. Two [[cameras]] entries whose canonical RTSP analysis endpoints collide (by CameraId's own canonicalisation — case-folded host, default-port collapse — not merely byte-identical strings) are rejected as a duplicate camera, with an actionable message naming BOTH colliding entries; two entries with genuinely different paths on the same host (the ordinary multi-channel-NVR deployment) load as two distinct cameras; and an entry's `live_rtsp_url` never participates in duplicate detection — only its own `rtsp_url` (analysis endpoint) does, which is what keeps a single real camera's analysis+live pair from ever colliding with itself or with an unrelated entry that happens to reuse one of its URLs in the other role. Only RTSP is exercised end to end here because this artifact refuses every other source kind as unsupported before duplicate detection is ever reached."
