rationale = "The Home Assistant MQTT adapter split into the vigil-ha crate and a new vigil-bin composition root, carrying along an in-window free_port() fallibility refactor and a shared-support-module rename that changed 17 test bodies token-for-token without changing their behavior, plus 5 genuine test-coverage consolidations (4 broker correction tests folded into one composed-binary test; operator_action_command_effects_action split three ways across the composed binary's snapshot test, its correction-landing test, and site_channel's disabled-marker test) and 5 further genuine rewrites onto the new SiteControl/FakeSiteControl seam. collect_test_records was extended to walk vigil-ha and vigil-bin, which is what let this receipt see the true registered-vs-active gap at all: the frozen base commit (dea077c) inherited 35 registry entries that were this same branch's OWN deferred transition debt, not drift from an unrelated prior estate. Between a0f1207 (this branch's base, where dev sits) and dea077c, this branch did its own secret-type and settings-registry-boundary work (secret.rs, settings.rs, settings_registry_declare_boundary.rs, environment_read_surface.rs, cli_secret_flag_surface.rs, http_route_contract.rs, the HA discovery/MQTT-topic golden tests, and the relocation-proof kind itself), adding 34 new tests and renaming one (rtsp_credentials_debug_redacts_password to rtsp_credentials_debug_redacts_password_and_keeps_username_visible) without authoring a test-estate transition for any of it at the time, because transitions were deliberately deferred during that work. None of the 35 predates a0f1207; all 35 are this branch's own postponed registration coming due here, closed in the same pass as the HA/vigil-bin split's own removed/added identities because both share the identical dea077c..HEAD diff, along with test-contracts.toml, non-rust-test-contracts.toml, documentation-contracts.toml and test-estate-exceptions.toml, all repointed to the same current identities in this batch."
