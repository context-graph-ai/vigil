zero_lost_detection = "This transition only adds nineteen new tests across four existing guard files; it removes no test from the governed vector, so no existing detection is lost. Two existing tests were RENAMED in the same commit set (vigil::transport_purity::no_package_alias_for_the_transport_crate_in_any_production_manifest and vigil::transport_purity::scan_catches_a_transport_dependency_renamed_via_the_package_field_in_a_real_manifest), but neither name was ever registered in any prior receipt or contract before this transition — both were authored and renamed within this same uncommitted working session, so there is no prior registered identity to account for as removed."
rationale = "Closes two independently reproduced guard evasions plus one gap an independent review found while auditing the fix, and folds in one unrelated but cheap completeness check the review sized as worth doing now rather than deferring. (1) AutomationHandle: automation_handle_capability_scan.rs's impl-header match named only the literal identifier AutomationHandle, so a direct type alias (type AutomationHandleAlias = AutomationHandle;) let an impl on the alias reach the owner-only set_manual/return_to_automatic methods while the guard stayed green. Fixed with a lexical alias-resolution pass (direct_type_aliases_of) that finds every DIRECT alias of AutomationHandle — bare, generic-preserving, declared inside a nested module, and with a path-qualified right-hand side — and folds each into the impl-header match; a decoy test proves the match is by whole-identifier equality, never a substring. Alias-of-an-alias and use-as re-export indirection are documented residuals, not chased. Every new alias-form test demonstrates BOTH the pre-fix miss (the unmodified TARGET_TYPE-only detector, kept byte-for-byte in this file, reports nothing on the identical planted text) and the post-fix catch, not a born-green assertion. (2) Transport purity: the guard scanned only .rs source files for the literal substring \"iroh\", so a manifest entry naming the transport crate — either directly as the dependency key (iroh = \"...\") or via a package = \"...\" local-alias rename (mesh = { package = \"iroh\" }) — was invisible, since Cargo.toml was never enumerated by the walker and no .rs file ever had to spell the literal name. Fixed with a declaration-level TOML scan (manifest_forbidden_dependency_declarations) that recurses through every dependency table Cargo recognizes (dependencies, dev-dependencies, build-dependencies, any target.'cfg(...)'.* sibling, workspace.dependencies) and flags a forbidden crate named as either the key or the package field; covers the workspace root Cargo.toml and each production crate's own. Verified this does NOT false-positive on the existing legitimate contextdb-server features = [\"iroh\"] entry (a feature-flag string, not a package name). The dependency-direction guard's own declaration-level graph parser was independently confirmed already immune to the same rename class (cargo metadata's packages[].dependencies[].name reports the real crate name regardless of a local key), locked in by a new fixture rather than a code change. Documented residual for both: a vendored fork renamed at its own source, and a rename of a rename, are unenumerable from this repository's own manifests. (3) vigil-bin dependency-direction coverage: the guard covered core (vigil) and the adapter (vigil-ha) but not the composed product binary (vigil-bin); added a NORMAL-only (shipped-in-the-binary) direct-dependency check against the same substrate/MQTT forbidden list, deliberately excluding dev-dependencies since vigil-bin's own acceptance-journey suites legitimately depend on the substrate and a real broker directly. (4) PRODUCTION_CRATES completeness: source_scan_lexer.rs's crate-scope walker relied on a hand-maintained three-crate list with no check that it covered every real workspace member; added a workspace-member classification check (every real workspace_members entry, from cargo metadata, must be in PRODUCTION_CRATES or an explicit small non-product list) so a fifth workspace member fails loudly instead of silently sitting outside every crate-scope scan. Chose cargo metadata's workspace_members over workspace_default_members, which today happens to equal PRODUCTION_CRATES but is a build-convenience field that could be re-tuned independent of which crates are real product surfaces. (5) settings_surface_coverage.rs (found by review while auditing this batch, not part of the original two evasions): added three canaries proving the PRODUCTION observation path itself (not just check_coverage's already-canaried pure logic) notices an absence on each of the pilot setting's three declared surfaces, by stripping its key/name from the real add-on config and real documentation page content in memory and routing it through one shared observe_entry_surfaces function the real test and every canary call identically — never a duplicated copy of the observation logic. A companion throwaway-worktree run (not a repo test, no identity) proved the file-level property these in-repo canaries structurally cannot: deleting the setting's key from the real addons/vigil/config.yaml on disk and running the unmodified real test produced exactly the expected AddonOption gap. A same-file, identity-neutral follow-up assertion (inside the existing add-on canary, not a new test) additionally proves the add-on observation keys on the declared add-on_option_key and not the setting's name, using a synthetic entry whose name and key deliberately differ — the pilot setting's own name and key happen to be equal, so the original canary alone could not distinguish the two. None of (1)-(5) touches product source except two accuracy corrections to pre-existing comments (crates/vigil/src/config.rs, overclaiming two baselined legacy environment reads as declared settings) and one stale doc-comment path (crates/vigil-ha/src/ha_mqtt_tasks.rs, pointing at a golden file's pre-split location) that an independent review found while reading this batch and asked to be corrected in the same pass; both are text-only, no behavior change. Also closes a hidden-knob hole an independent review found in this same audit: environment_read_surface.rs and cli_secret_flag_surface.rs each enforced only observed==baseline set equality (plus a ceiling), which a COORDINATED one-for-one swap (add a hidden read/flag to source and the mutable baseline file together, remove one real baselined entry from both) defeats, because both files were edited to match each other and the equality and ceiling checks both still pass. Fixed identity-neutrally (no new #[test], additive assertions inside the two existing baseline-count tests) by freezing each scan's ORIGINAL baseline membership as a Rust constant inside the already-immutable test file and asserting the live baseline is always a SUBSET of that frozen original — a genuinely new entry is never a member of the frozen original however the count balances, while a legitimate burn-down (removing an entry as a read/flag is migrated away) still leaves a subset and stays green, preserving the ratchet the baseline exists to enable. Both outcomes are proven as planted-fault assertions inside the existing baseline-count test for each file: a coordinated swap goes red, a burn-down stays green."
