zero_lost_detection = "The renamed arm (direct_forbidden_names_excluding_dev) is a strict widening of the removed arm (direct_forbidden_names_normal_only): every case the NORMAL-only filter could catch, the NORMAL-or-BUILD filter still catches identically (edge_is_normal is a subset of edge_is_normal_or_build), and it additionally catches a BUILD-kind edge the removed arm structurally could not see. CORRECTION during review: an initial classification of three of the four renames as body-identical (fit for a relocation proof) was checked against `cargo xtask test-estate-dump-records`'s own normalized-token bodies and found WRONG — every one of the four survivor bodies calls the renamed function by its new name, so the normalized token stream differs by that one identifier for all four, not only the fourth; none qualify for the strict byte/token-identical relocation proof. All four are instead proven by redundant-fault-detection: two paired single-mutant faults (documented per-proof below) were planted directly in the pure filter functions under test (edge_is_normal at the removed identities' commit e4e00a6; edge_is_normal_or_build at the survivor identities' commit 6782f04) and both the removed test and its surviving counterpart were run for real, independently, and both CAUGHT the identical fault class with a nonzero exit — proving the survivor's coverage subsumes the removed test's coverage without relying on body equality. The real guard (product_binary_crate_never_ships_a_direct_dependency_on_a_substrate_or_mqtt_transport_crate) now calls the widened arm and was proven against real cargo metadata in a throwaway worktree: an optional, target-specific, package-renamed build-dependency planted in vigil-bin/Cargo.toml passes the pre-fix guard and fails the post-fix guard with the exact crate name; a plain normal-kind planted dependency is likewise caught; the real unmodified tree stays green."
rationale = "Two independently reproduced blockers — a dependency-direction guard gap and a baseline-equality-vs-ceiling gap — plus a review-round correction to how the first was receipted, and a separate identity-neutral fix folded into the same round.\n\n(1) The vigil-bin dependency-direction arm (direct_forbidden_names_normal_only) checked only NORMAL-kind edges, so an optional, target-specific BUILD-dependency rename to context-graph passed the real guard undetected; a fixture test (direct_forbidden_names_normal_only_ignores_a_dev_only_edge_the_all_kinds_arm_would_catch) froze the narrower behavior as correct without ever probing the BUILD kind the same filter silently excluded alongside DEV. Fixed by widening the arm to NORMAL and BUILD (edge_is_normal_or_build), keeping DEV as the one documented exception (vigil-bin's real acceptance-suite dev-dependencies on the substrate and rumqttc), and renaming the arm and its four fixture tests from _normal_only_ to _excluding_dev_ so the name states what it now checks. The flagged fixture test is renamed and its body rewritten to prove BOTH halves of the real distinguishing behavior together (a build-only edge is now caught; a dev-only edge is still legitimately ignored) rather than freezing only the narrower half; verified against real cargo metadata in a throwaway worktree with an optional, target-specific, package-renamed build-dependency actually planted in vigil-bin/Cargo.toml: the pre-fix guard passed (reproducing the miss), the post-fix guard failed with the exact crate name, and the real unmodified tree stays green.\n\n(2) baseline_parses_into_the_expected_count in environment_read_surface.rs and cli_secret_flag_surface.rs pinned the real on-disk baseline file to exact equality with its starting count, which blocks terminal burn-down harder than the floor it replaced — verified in a throwaway worktree by substituting an actual empty baseline file on disk and observing the committed (pre-fix) assertion fail with 0 != 70 and 0 != 1 exactly as the independent review reported. Fixed by changing both assertions from equality to a ceiling (baseline.len() <= BASELINE_STARTING_SITE_COUNT), matching the ceiling already used one test over in no_new_...only_shrinks, so a baseline burned all the way down to empty still passes; re-verified in the same throwaway worktree with the same substituted empty file that the fixed assertion now passes with the positive control still firing. (2) is a body-only change to two already-registered tests and carries no test identity impact; only (1)'s rename is reflected in this receipt.\n\n(3) REVIEW ROUND: an owner-ruling proof was initially attached covering all four renamed identities, which independent review rejected as the wrong proof kind for machine-checkable renames. Re-derivation with `cargo xtask test-estate-dump-records` against both commits showed all four renamed bodies differ from their removed counterparts at the normalized-token level (each calls the renamed function by its new name), so relocation's byte/token-identical requirement does not hold for any of the four — not just the one whose body was deliberately rewritten. All four are instead proven by four separate redundant-fault-detection proofs below, each a single hand-planted mutation to the shared filter logic with both the removed and surviving test independently run to a real CAUGHT (nonzero exit).\n\n(4) SEPARATE, IDENTITY-NEUTRAL FIX folded into the same review round: cli_secret_flag_surface.rs's no_new_secret_cli_flags_and_baseline_only_shrinks enforced only observed-minus-baseline, unlike its sibling environment_read_surface.rs, which already asserted both directions — a stale baseline entry (a flag removed from source but left in the baseline) was invisible, so if the same secret-shaped flag were later re-added to source the guard would stay silently green. Fixed to the same bidirectional shape as the sibling file (observed-minus-baseline and baseline-minus-observed asserted together), with an in-test canary on synthetic sets proving a stale-only baseline entry is caught, and independently verified end-to-end by substituting a real baseline line naming a flag absent from source: the unmodified real scan correctly reported both the missing real flag and the stale baseline entry together. No new #[test], no identity impact."
reviewer = "independent final review by codex gpt-5.6-sol, 2026-07-23, commit ed8eea8"

