zero_lost_detection = "This transition only adds one new canary to settings_surface_coverage.rs; it removes no test from the governed vector, so no existing detection is lost. The new canary proves the documentation-surface check is bound to the setting's own contract-bearing paragraph (via xtask::test_estate::adjacent_paragraph) rather than a page-wide substring search: it isolates the real docs/configuration.md page, which names the pilot setting a second time outside its bound paragraph, and shows that stripping the name from only the bound paragraph still reports a documentation gap even though the incidental mention survives elsewhere on the page. Verified to genuinely bite: reverting observe_entry_surfaces to the old page-wide doc_text.contains(entry.name) check turns this canary red (0 gaps reported instead of 1), confirmed by running the test both ways in the working tree before restoring the fix."
rationale = "Closes the page-wide substring hazard in settings_surface_coverage.rs's documentation-surface check (doc_text.contains(entry.name)), which an incidental mention of a setting's name anywhere on its documentation page would satisfy even if the setting's own documenting paragraph lost that name. The fix binds the check to the setting's own contract-bearing paragraph, located by calling xtask::test_estate::adjacent_paragraph (exposed from a new xtask library target, xtask/src/lib.rs, added specifically so this parser is genuinely CALLED rather than re-implemented a second time in the guard test) — never a second, independently-drifting implementation of the same backward paragraph scan. The claim-id-to-paragraph mapping is test-only bookkeeping (a new documentation_claim_id_for function in the test file), not a field on the production SettingSurfaces type, because verifier metadata does not belong on a production struct."
