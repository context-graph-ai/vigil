zero_lost_detection = "Each removed row asserted one point of a decision table that its surviving table-driven test now asserts as one row. Every removed row carries its own planted fault, targeting that row specifically rather than one blanket fault, and both the removed row test and the surviving table test were run against that exact fault: all eight pairs returned CAUGHT with a nonzero exit, so no mutant moved from caught to missed. The surviving tests run every row unconditionally and accumulate all failures before panicking once, so a first-row failure cannot hide the remaining rows, and each row keeps its own name, inputs and rationale in the failure message."
rationale = "Four tests exercised one pure steal-decision function at four points of the same deadline-elapsed by claimant-alive matrix, and four more exercised one Supervisor MQTT response parser on four invalid shapes. Collapsing each family into a table-driven test keeps every case and its diagnostic while removing the per-case function boilerplate. The positive-shape parser test stays a separate test because it asserts four distinct fields rather than a rejection. No production behavior changed: the supervisor edit lands strictly inside its cfg(test) module, below the attribute at supervisor.rs line 220, and every diff hunk in that file is inside that module."
reviewer = "independent review completed by codex gpt-5.6-sol (fresh final pass), 2026-07-22, commit dc8e1f4"

