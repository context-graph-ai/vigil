rationale = "A prior review round dismissed the turbofish spelling of Command::new/SettingsRegistry::declare/command_output as not applicable, reasoning those functions were non-generic; that premise was never checked and was false — Command::new::<&str>(\"cargo\"), a generic helper's own ::<_, _> form, and registry.declare::<u32>(spec) all confirmed to compile clean under -D warnings on the pinned toolchain, including the spaced form, rather than assumed. A turbofish is an explicit type-argument list on an otherwise ordinary path segment or call; it does not change which function is invoked, only how its type parameters are spelled, so it belongs in the same closeable, token-stream-determinable class as whitespace, a raw identifier, and a qualified path. Closed once in the shared source_scan_lexer.rs module (skip_optional_turbofish: an optional ::<...> after skipping insignificant whitespace, tolerating the empty ::<> form, reusing the existing match_angle_bracket for the balanced-bracket read) rather than per marker, because a per-marker implementation is exactly the capability-not-reaching-a-site defect this same family has now paid for repeatedly (the qualified-path axis needed a second, explicit consumption point in the boundary guard after being closed in the process-cleanup guard first). Consumed at both call-boundary sites the fix needed to reach: process_cleanup_scan.rs's find_live_token_sequence now tries skip_optional_turbofish immediately before matching any \"(\" token in a sequence, which automatically reaches every token-sequence-based marker built on it (Command::new build detection, the raw-shell-kill and negative-kill-argument checks that reuse the identical Command::new sequence, the libc::kill allowed-path detection, and the command_output/command_status same-call-argument helpers); settings_registry_declare_boundary.rs's declare_call_positions now calls skip_optional_turbofish between the declare identifier and its required opening paren, since that file's call-boundary check is a bare identifier-position scan, not a token-sequence match, and so needed its own explicit call site reusing the same shared primitive rather than a second implementation. Four canaries prove reach across every named site: Command::new::<&str>(\"cargo\").args([\"build\"]) is banned while the identical ::<&str>(env!(\"CARGO\")) metadata read stays allowed; Command::new::<&str>(\"kill\") is caught by the raw-shell-kill check through the same sequence; command_output::<_, _>(\"<runtime>\", [\"build\"]) is banned; and registry.declare::<u32>(spec) plus its UFCS turbofish spelling are flagged outside declare_settings while allowed genuinely inside it. Each bite-proven by temporarily removing its own skip_optional_turbofish call site, confirming the canary goes red (0 violations reported instead of 1), then restoring and confirming green. A companion raw-string-literal pressure test, run explicitly to trace the fail-closed question (does an unrecognized or raw-string program argument reach the refuse path or an allow path) rather than spot-check: Command::new(r\"cargo\")/(r#\"cargo\"#)/(r##\"cargo\"##) and the identical delimiter variants for \"kill\" and the container runtime name were all traced end to end and are ALREADY correctly recognized and banned by the existing classification path, which operates on the shared lexer's decoded string content matched by exact literal span, never a masked-text substring search — so this is a non-finding, not a sixth axis, and required no code change. Two hard-parenthesized forms (Command::new((\"cargo\")), <(Command)>::new(\"cargo\")) were independently confirmed to be rustc's own unused_parens lint, a hard error under -D warnings and therefore reachable only behind a review-visible #[allow], and are left as a documented lint-blocked residual rather than closed in code. Per a standing correction, the honest-limit documentation in both guards no longer states a count of closeable axes or evasion forms (a prior \"three axes\" claim was falsified by the qualified-path find, and a replacement \"four\" would only be falsified again by the next one); both guards now state the closeable side by CRITERION instead — every spelling of the construct determinable from the token stream alone, via the shared lexer, is recognized, and a newly found token-determinable spelling that evades it is a bug against that criterion to be fixed, never a number to bump — with the residual stated the same way it already was (aliasing/indirection requiring a name resolved to its definition: use ... as, a type alias, a function-pointer binding, a re-export, or a macro-generated invocation). No product source changed; all three touched files are test-estate guard sources plus this registry."
