rationale = "settings_registry_declare_boundary.rs's is_settings_registry_declare_call recognized the fully-qualified associated-function (UFCS) form SettingsRegistry::declare(registry, spec) by reading the identifier immediately before the call's :: qualifier backward with read_ident_backward, but Rust's qualified-path spelling of the identical call — <SettingsRegistry>::declare(registry, spec), and the <SettingsRegistry as SomeTrait>::declare(...) variant, both confirmed to compile under the pinned toolchain rather than assumed — puts a closing > directly before that ::, not an identifier character, so read_ident_backward found nothing there, is_settings_registry_declare_call returned false, and a second declare call spelled this way passed the boundary scan silently: the one-call-site guarantee the scan exists to enforce could be violated with no red anywhere. This is the same qualified-path lexical evasion already closed in process_cleanup_scan.rs's Command::new recognition; rather than writing a second, independently-drifting implementation of the angle-bracket matching, the closing-`>` detection, and the qualified-path-to-final-segment read, those primitives (match_angle_bracket, match_angle_bracket_backward, find_as_keyword, qualified_path_match, qualified_path_match_backward) were promoted from process_cleanup_scan.rs into the shared source_scan_lexer.rs module every sibling guard already includes, and process_cleanup_scan.rs's own now-redundant local copies (plus a stale, orphaned duplicate doc-comment fragment left behind by an earlier edit that inserted them) were deleted in the same pass. is_settings_registry_declare_call now checks whether the qualifier immediately before :: ends in > and, if so, delegates to the newly-added qualified_path_match_backward (a backward-oriented wrapper that finds the matching < and reuses the exact same forward qualified_path_match logic) before falling back to the original plain identifier read, so both the bare <SettingsRegistry>:: and the <SettingsRegistry as Trait>:: spellings are recognized without a second implementation. Verified to genuinely bite: with the qualified-path fallback removed, the new canary's planted <SettingsRegistry>::declare(...) call outside declare_settings reports zero violations (the exact silent-pass gap); restoring the fallback reports one violation and the full existing suite (including the unrelated-type and real-allowed-call-site negative cases carried over from the plain-UFCS canary) stays green. Scope was independently re-checked rather than only trusted: environment_read_surface.rs's qualifier check matches a module path, not a type-associated call, so it is unaffected; automation_handle_capability_scan.rs matches impl headers, and impl <Type> was independently confirmed NOT valid Rust by compiling it under the pinned toolchain (rustc: \"expected type, found '{'\"), so that guard has no equivalent evasion; free_port, transport-purity, the secret-flag scan, and the documentation coverage check do not match a type-qualified associated call at all. No product source changed; both touched files are test-estate guard sources."
