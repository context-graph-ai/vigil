rationale = "Extracts the unsafe-cleanup/nested-artifact-build scan out of tests/acceptance/common.rs (where it was bundled with unrelated artifact-resolver assertions) into crates/vigil/tests/process_cleanup_scan.rs, beside the sibling source-scan guards it shares a lexer and crate-scope walk with (environment_read_surface.rs, cli_secret_flag_surface.rs, transport_purity.rs) — closing the gap that the file's own header claimed 'protected by the same control-plane refusal lists' while remaining untracked and unregistered. In the same pass, the cargo- and container-runtime-subcommand resolution was rewritten from 'the nearest .arg/.args call found in a byte window after the invocation marker' (which misattributes an unrelated builder's own .arg call to a completely different, receiver-unrelated invocation) to genuine receiver attribution: the subcommand is read from the SPECIFIC Command::new(...) receiver's own chained .arg/.args call, or from the identifier that receiver was bound to if it was assigned to a variable first, or from a same-call-argument helper's own second positional argument (with its own literal array possibly itself bound to a variable, the real shape tests/acceptance/common.rs uses for its genuine docker run). Anything neither shape positively attributes stays banned, matching the pre-existing fail-closed default. The container-runtime axis was widened from a single fixed-spelling substring match to the identical receiver-attributed resolution cargo already had, so a real non-build invocation (docker inspect/logs/stop, which tests/acceptance/common.rs genuinely makes) is now correctly allowed rather than the whole class being either banned outright or silently mismatched by a brittle exact spelling. A new canary (cross_builder_variable_bound_decoy) proves the exact cross-builder decoy bug is closed: an unrelated builder's own .arg call, bound to a different variable, sitting between the cargo builder's binding and its own .arg('build') call, must not be misattributed — verified to genuinely bite by temporarily reverting the resolver to the old nearest-call design and confirming the canary goes red (0 violations reported instead of 1), then restoring the fix."
