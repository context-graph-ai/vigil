[[file]]
path = "crates/vigil/tests/the_startup_wait_for_readers_is_kernel_driven.rs"
reason = "Reviewed structural lineage, and structural BY NECESSITY: the contract is that the startup wait for a store's direct readers wakes on the RELEASE rather than on a timer, which the standing owner ruling of 2026-08-14 requires outright (an automatic re-attempt fires on a real event, never on a periodic timer). Both behavioral halves are already pinned unfakeably beside it -- a runtime that waits and comes up owning the store when the reader releases (crates/vigil-bin/tests/hydrating_reader_does_not_degrade_a_starting_runtime.rs) and a waiting runtime that still stops promptly with the abandoned-on-shutdown line (crates/vigil-bin/tests/a_waiting_runtime_still_stops_when_asked.rs) -- and both pass against the 250 ms sleep-retry loop and against a kernel wait alike, because the two are externally indistinguishable in outcome: what separates them is a quarter-second of latency on every start and a wakeup every 250 ms for as long as the wait lasts. Asserting on either would be exactly the elapsed-time judgment the ruling forbids, so the behavioral legs stay where they are as regressions the replacement must keep passing and the shape is what is read here. Scoped to the reader-clearing wait alone (one named function body, plus the pacing constant's declaration in the same file); every other sleep in vigil is a different caller and is untouched. Carries a positive control that the guard recognizes a sleep-retry wait and a negative control that a wait blocking on contextdb's own wait_for_reader_release satisfies it whatever the surrounding arrangement ends up being."
