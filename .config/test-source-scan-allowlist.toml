path = "crates/vigil/tests/every_command_that_reaches_the_owner_channel_is_in_the_family.rs"
reason = "Reviewed structural scan, and structural BY NECESSITY: the contract is that the list of subcommands which become this deployment's runtime user before they open the owner channel is CLOSED -- no dispatch arm reaches that channel from outside it -- and the defect it guards is a subcommand's ABSENCE from a list, which has no behavior to observe. A behavioral form can only exercise the subcommands someone thought to name, which is the same set someone thought to add to the list, so it would have passed against the omission that left `vigil settings` opening the owner channel as whoever ran it while the read commands beside it were served. The scan reads only the command dispatch in crates/vigil/src/lib.rs, in both directions (every arm that routes to print_control_or_direct or print_settings is a member, and every member has such an arm), asserts the dispatch takes the identity step from the family list itself rather than a second hand-written one, and carries a planted-text positive/negative control plus a both-kinds-present check on the real dispatch, so a reader that recognized nothing cannot pass quietly."

