[[file]]
path = "crates/vigil/tests/a_failed_open_is_classified_from_the_error_it_returned.rs"
reason = "Reviewed structural lineage, and structural BY NECESSITY: the contract is that a read command classifies the typed failure its own open returned rather than opening the store a second time to ask again, and the defect only shows behaviorally in the window between those two opens -- a holder that lets go in between makes the second open succeed, so the review commands answer capability-unavailable and the settings surface prints the stale first error, about a store that is no longer the one that refused the command. That window cannot be timed from a test, and both behavioral constructions attempted first came out GREEN against the defective source and were kept as regressions rather than passed off as captures: the whole-deployment-directory fingerprint (a refused command must touch this deployment's storage not at all, which catches the writable node handle the second open goes through if it ever leaves a trace) and the write-protected-store arm (the second open meets a permission failure the first never saw). A path that classifies the failure in hand has no second observation to disagree with, so the race stops existing rather than becoming rare -- which is exactly what this guard reads for. It forbids two named shapes on the read-command path only, carries a positive control that the forbidden shape is recognized and a negative control that an error-classifying path satisfies it whatever its classifier and type end up being called, and leaves the startup path -- a different caller, whose job IS to open and take the store -- entirely alone."

