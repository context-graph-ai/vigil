name: Change qualification

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: vigil-change-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 1
  CARGO_PROFILE_TEST_DEBUG: 1
  RUSTFLAGS: ""
  CARGO_BUILD_JOBS: 2
  NEXTEST_TEST_THREADS: 2

jobs:
  portable:
    name: Portable CI checks (not full qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: shellcheck@0.11.0
          fallback: none
      - name: Install reviewed actionlint (not supported by install-action)
        run: |
          tool_dir="$RUNNER_TEMP/vigil-portable-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"
      - run: ./scripts/ci-portable

  source-revisions:
    name: Validate public exact dependency tuple
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require publicly accessible immutable dependencies
        env:
          CI_METADATA_TOKEN: ${{ github.token }}
        run: ./scripts/ci-public-dependencies check > change-source-revisions.json
      - name: Upload immutable source receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: change-source-revisions
          path: change-source-revisions.json
          if-no-files-found: error
          retention-days: 14

  change:
    name: Default change gate
    needs: source-revisions
    uses: ./.github/workflows/default-checks.yml

  change-gate:
    name: Change qualification receipt
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [portable, source-revisions, change]
    steps:
      - name: Require every full change prerequisite
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          PUBLIC_TUPLE_RESULT: ${{ needs.source-revisions.result }}
          CHANGE_RESULT: ${{ needs.change.result }}
        run: |
          test "$PORTABLE_RESULT" = "success"
          test "$PUBLIC_TUPLE_RESULT" = "success"
          test "$CHANGE_RESULT" = "success"

  # Auxiliary delivery is outside the correctness aggregate.
  development-binaries:
    needs: [change-gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'context-graph-ai/vigil' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build.yml
