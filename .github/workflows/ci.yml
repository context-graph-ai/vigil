name: Change qualification

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: vigil-change-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 1
  CARGO_PROFILE_TEST_DEBUG: 1
  CARGO_BUILD_JOBS: 2
  NEXTEST_TEST_THREADS: 2

jobs:
  private-dependency-boundary:
    name: Private dependency boundary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject fork code before any credential is available
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Vigil's dependency checkout is restricted to trusted branches." >&2
          echo "Fork code is not run with CG_CI_TOKEN; a maintainer must qualify the exact commit from a trusted branch." >&2
          exit 1

      - name: Confirm trusted pull-request source
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: echo "Trusted pull-request code may resolve the private dependency boundary."

  source-revisions:
    name: Resolve dependency SHAs once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: private-dependency-boundary
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      context_graph_sha: ${{ steps.revisions.outputs.context_graph_sha }}
      contextdb_sha: ${{ steps.revisions.outputs.contextdb_sha }}
    steps:
      - name: Resolve Context Graph dev
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: dev
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false

      - name: Resolve ContextDB dev
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: dev
          path: contextdb
          persist-credentials: false

      - name: Record immutable dependency revisions
        id: revisions
        run: |
          context_graph_sha="$(git -C context-graph rev-parse HEAD)"
          contextdb_sha="$(git -C contextdb rev-parse HEAD)"
          test "${#context_graph_sha}" -eq 40
          test "${#contextdb_sha}" -eq 40
          echo "context_graph_sha=${context_graph_sha}" >> "$GITHUB_OUTPUT"
          echo "contextdb_sha=${contextdb_sha}" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg vigil_sha "$GITHUB_SHA" \
            --arg context_graph_sha "$context_graph_sha" \
            --arg contextdb_sha "$contextdb_sha" \
            '{tier:"change",vigil_sha:$vigil_sha,context_graph_sha:$context_graph_sha,contextdb_sha:$contextdb_sha}' \
            > change-source-revisions.json

      - name: Upload immutable source receipt
        uses: actions/upload-artifact@v4
        with:
          name: change-source-revisions
          path: change-source-revisions.json
          if-no-files-found: error
          retention-days: 14

  change:
    name: Default change gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: source-revisions
    steps:
      - name: Checkout exact Vigil change
        uses: actions/checkout@v4
        with:
          path: vigil
          persist-credentials: false

      - name: Checkout exact Context Graph dependency
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ needs.source-revisions.outputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false

      - name: Checkout exact ContextDB dependency
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ needs.source-revisions.outputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install bounded runtime test tools
        run: |
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg mosquitto mosquitto-clients

      - name: Restore the trusted change cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vigil
          key: change-v1

      - name: Set up the default runtime harness
        working-directory: vigil
        run: cargo xtask setup-runtime-harness

      - name: Check formatting
        working-directory: vigil
        run: cargo fmt --all --check

      - name: Lint default workspace targets
        working-directory: vigil
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Enumerate the exact default estate
        working-directory: vigil
        run: cargo nextest list --locked --workspace -T json > target/nextest-default.json

      - name: Enforce the test estate and default inventory
        working-directory: vigil
        run: cargo xtask test-estate-check --nextest-json default=target/nextest-default.json

      - name: Run default tests
        working-directory: vigil
        run: cargo nextest run --locked --profile pr --workspace --test-threads 2

  change-gate:
    name: Change qualification receipt
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [private-dependency-boundary, source-revisions, change]
    steps:
      - name: Require the trusted default gate
        run: |
          test "${{ needs.private-dependency-boundary.result }}" = "success"
          test "${{ needs.source-revisions.result }}" = "success"
          test "${{ needs.change.result }}" = "success"
      - name: Attach the successful change gate to the exact feature commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state=success \
            --field context=vigil/change \
            --field description='Cheap per-commit Vigil change gate passed' \
            --field target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
