name: Dev HAOS deploy artifact

on:
  workflow_dispatch:
    inputs:
      vigil_sha:
        description: "Exact current dev commit to build for HAOS"
        type: string
        required: true
      context_graph_sha:
        description: "Exact current Context Graph dev commit"
        type: string
        required: true
      contextdb_sha:
        description: "Exact current ContextDB dev commit"
        type: string
        required: true
      cache_epoch:
        description: "Explicit cache namespace for this deploy artifact"
        type: string
        required: true
        default: "dev-haos-artifact-v1"

  workflow_call:
    inputs:
      vigil_sha:
        description: "Exact current dev commit to build for HAOS"
        type: string
        required: true
      context_graph_sha:
        description: "Exact current Context Graph dev commit"
        type: string
        required: true
      contextdb_sha:
        description: "Exact current ContextDB dev commit"
        type: string
        required: true
      cache_epoch:
        description: "Explicit cache namespace for this deploy artifact"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: vigil-dev-haos-artifact-${{ inputs.vigil_sha }}-${{ inputs.context_graph_sha }}-${{ inputs.contextdb_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  exact-sources:
    name: Verify exact deploy sources
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      vigil_sha: ${{ steps.identity.outputs.vigil_sha }}
      context_graph_sha: ${{ steps.identity.outputs.context_graph_sha }}
      contextdb_sha: ${{ steps.identity.outputs.contextdb_sha }}
    steps:
      - name: Require trusted dev dispatch and immutable current inputs
        env:
          VIGIL_SHA: ${{ inputs.vigil_sha }}
          CONTEXT_GRAPH_SHA: ${{ inputs.context_graph_sha }}
          CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
          CACHE_EPOCH: ${{ inputs.cache_epoch }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev | refs/heads/dev-next) ;;
            *)
              echo "dispatch HAOS deploy artifacts from trusted dev or dev-next" >&2
              exit 1
              ;;
          esac
          for value in "$VIGIL_SHA" "$CONTEXT_GRAPH_SHA" "$CONTEXTDB_SHA"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "HAOS deploy artifact requires three exact commit identities" >&2
              exit 1
            }
          done
          [[ "$CACHE_EPOCH" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || {
            echo "cache_epoch must be a 1-64 character cache-key token" >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$VIGIL_SHA" || {
            echo "dev moved before HAOS artifact dispatch" >&2
            exit 1
          }

      - name: Checkout exact Vigil commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.vigil_sha }}
          fetch-depth: 0
          path: vigil
          persist-credentials: false
      - name: Fetch validated public exact dependencies
        working-directory: vigil
        env:
          CI_METADATA_TOKEN: ${{ github.token }}
          EXPECTED_CG_SHA: ${{ inputs.context_graph_sha }}
          EXPECTED_DB_SHA: ${{ inputs.contextdb_sha }}
        run: ./scripts/ci-public-dependencies checkout "$EXPECTED_CG_SHA" "$EXPECTED_DB_SHA"

      - name: Prove clean current development tuple
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: ${{ github.ref_name }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_VIGIL_SHA: ${{ inputs.vigil_sha }}
          EXPECTED_CONTEXT_GRAPH_SHA: ${{ inputs.context_graph_sha }}
          EXPECTED_CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
        run: |
          vigil_sha="$(git -C vigil rev-parse HEAD)"
          dev_sha="$(git -C vigil rev-parse origin/dev)"
          dev_next_sha="$(git -C vigil rev-parse origin/dev-next)"
          context_graph_sha="$(git -C context-graph rev-parse HEAD)"
          contextdb_sha="$(git -C contextdb rev-parse HEAD)"
          test "$vigil_sha" = "$EXPECTED_VIGIL_SHA"
          # The artifact is only ever built from the CURRENT TIP of a trusted
          # branch, never an arbitrary commit: dev for shippable builds, and
          # dev-next so a change can be qualified on real hardware before it
          # merges.
          case "$TRUSTED_BRANCH" in
            dev) test "$vigil_sha" = "$dev_sha" ;;
            dev-next) test "$vigil_sha" = "$dev_next_sha" ;;
            *) exit 1 ;;
          esac
          test "$context_graph_sha" = "$EXPECTED_CONTEXT_GRAPH_SHA"
          test "$contextdb_sha" = "$EXPECTED_CONTEXTDB_SHA"
          case "$CALLER_WORKFLOW_REF" in
            context-graph-ai/vigil/.github/workflows/dev-haos-artifact.yml@refs/heads/"$TRUSTED_BRANCH")
              test "$(gh api "repos/context-graph-ai/context-graph/git/ref/heads/$TRUSTED_BRANCH" --jq '.object.sha')" = "$context_graph_sha"
              test "$(gh api "repos/context-graph-ai/contextdb/git/ref/heads/$TRUSTED_BRANCH" --jq '.object.sha')" = "$contextdb_sha"
              ;;
            context-graph-ai/vigil/.github/workflows/build.yml@refs/heads/dev | context-graph-ai/vigil/.github/workflows/ci.yml@refs/heads/dev)
              # Public checkout above enforces the exact committed dependency pins.
              ;;
            *) echo "untrusted delivery caller" >&2; exit 1 ;;
          esac
          test -z "$(git -C vigil status --porcelain=v1)"
          test -z "$(git -C context-graph status --porcelain=v1)"
          test -z "$(git -C contextdb status --porcelain=v1)"
          {
            echo "vigil_sha=$vigil_sha"
            echo "context_graph_sha=$context_graph_sha"
            echo "contextdb_sha=$contextdb_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build exact HAOS production binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: exact-sources
    steps:
      - name: Checkout exact Vigil commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.exact-sources.outputs.vigil_sha }}
          path: vigil
          persist-credentials: false
      - name: Fetch validated public exact dependencies
        working-directory: vigil
        env:
          CI_METADATA_TOKEN: ${{ github.token }}
          EXPECTED_CG_SHA: ${{ needs.exact-sources.outputs.context_graph_sha }}
          EXPECTED_DB_SHA: ${{ needs.exact-sources.outputs.contextdb_sha }}
        run: ./scripts/ci-public-dependencies checkout "$EXPECTED_CG_SHA" "$EXPECTED_DB_SHA"

      - name: Free hosted-runner build disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Stage the bounded production source context
        run: |
          mkdir -p haos-context
          tar \
            --exclude='*/target' \
            --exclude='*/target/**' \
            --exclude='*/.vigil-tools-target' \
            --exclude='*/.vigil-tools-target/**' \
            --exclude='*/.git' \
            --exclude='*/.git/**' \
            --exclude='*/tests/fixtures/.cache' \
            --exclude='*/tests/fixtures/.cache/**' \
            -cf - vigil context-graph contextdb | tar -xf - -C haos-context
      - name: Create hardware artifact output
        run: mkdir -p haos-output/receipts
      - name: Build and receipt the HAOS production binary
        working-directory: vigil
        env:
          CACHE_EPOCH: ${{ inputs.cache_epoch }}
        run: |
          ./scripts/verify release \
            --lane artifact-amd64 \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state mixed \
            --receipt ../haos-output/receipts/dev-haos-artifact.json \
            -- docker buildx build \
              --platform linux/amd64 \
              --target vigil-hw-binary-amd64 \
              --file ../haos-context/vigil/Dockerfile.hardware \
              --cache-from "type=gha,scope=vigil-haos-amd64-$CACHE_EPOCH" \
              --cache-to "type=gha,mode=max,scope=vigil-haos-amd64-$CACHE_EPOCH" \
              --output type=local,dest=../haos-output/binary \
              ../haos-context
      - name: Load the matching builder environment for offline CLI smoke
        env:
          CACHE_EPOCH: ${{ inputs.cache_epoch }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target vigil-hw-builder-amd64 \
            --file haos-context/vigil/Dockerfile.hardware \
            --cache-from "type=gha,scope=vigil-haos-amd64-$CACHE_EPOCH" \
            --load --tag vigil-haos-smoke-builder:local \
            haos-context
      - name: Smoke the unpacked exact package before upload
        run: |
          python3 vigil/scripts/ci-packaged-smoke.py \
            haos-output/binary/vigil \
            haos-output/vigil-haos-production-amd64.tar.gz \
            vigil-haos-smoke-builder:local \
            haos-output/receipts/dev-haos-artifact-smoke.json
      - name: Create minimal delivery receipt with actual builder toolchain
        working-directory: vigil
        env:
          OUTPUT_DIRECTORY: ../haos-output
        run: |
          builder_toolchain="$(docker run --rm --pull=never --network=none --entrypoint rustc vigil-haos-smoke-builder:local --version)"
          python3 scripts/ci-development.py receipt "$OUTPUT_DIRECTORY" "$builder_toolchain"
      - name: Bind the artifact to its exact source tuple
        env:
          VIGIL_SHA: ${{ needs.exact-sources.outputs.vigil_sha }}
          CONTEXT_GRAPH_SHA: ${{ needs.exact-sources.outputs.context_graph_sha }}
          CONTEXTDB_SHA: ${{ needs.exact-sources.outputs.contextdb_sha }}
        run: |
          sha256sum haos-output/binary/vigil > haos-output/receipts/dev-haos-artifact.sha256
          jq -n \
            --arg vigil_sha "$VIGIL_SHA" \
            --arg context_graph_sha "$CONTEXT_GRAPH_SHA" \
            --arg contextdb_sha "$CONTEXTDB_SHA" \
            --arg binary_sha256 "$(cut -d' ' -f1 haos-output/receipts/dev-haos-artifact.sha256)" \
            '{tier:"dev-haos-artifact",artifact:"native-alpine-production-binary",published:false,vigil_sha:$vigil_sha,context_graph_sha:$context_graph_sha,contextdb_sha:$contextdb_sha,binary_sha256:$binary_sha256}' \
            > haos-output/receipts/dev-haos-artifact-source.json
      - name: Upload the exact HAOS deploy artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vigil-haos-production-amd64-${{ needs.exact-sources.outputs.vigil_sha }}
          path: |
            haos-output/vigil-haos-production-amd64.tar.gz
            haos-output/delivery.json
            haos-output/receipts/dev-haos-artifact.json
            haos-output/receipts/dev-haos-artifact.sha256
            haos-output/receipts/dev-haos-artifact-source.json
            haos-output/receipts/dev-haos-artifact-smoke.json
          if-no-files-found: error
          retention-days: 90
