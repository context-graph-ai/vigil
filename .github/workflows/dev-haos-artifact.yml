name: Dev HAOS deploy artifact

on:
  workflow_dispatch:
    inputs:
      vigil_sha:
        description: "Exact current dev commit to build for HAOS"
        type: string
        required: true
      context_graph_sha:
        description: "Exact current Context Graph dev commit"
        type: string
        required: true
      contextdb_sha:
        description: "Exact current ContextDB dev commit"
        type: string
        required: true
      cache_epoch:
        description: "Explicit cache namespace for this deploy artifact"
        type: string
        required: true
        default: "dev-haos-artifact-v1"

permissions:
  contents: read

concurrency:
  group: vigil-dev-haos-artifact-${{ inputs.vigil_sha }}-${{ inputs.context_graph_sha }}-${{ inputs.contextdb_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  exact-sources:
    name: Verify exact deploy sources
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      vigil_sha: ${{ steps.identity.outputs.vigil_sha }}
      context_graph_sha: ${{ steps.identity.outputs.context_graph_sha }}
      contextdb_sha: ${{ steps.identity.outputs.contextdb_sha }}
    steps:
      - name: Require trusted dev dispatch and immutable current inputs
        env:
          VIGIL_SHA: ${{ inputs.vigil_sha }}
          CONTEXT_GRAPH_SHA: ${{ inputs.context_graph_sha }}
          CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/dev" || {
            echo "dispatch HAOS deploy artifacts from trusted dev with --ref dev" >&2
            exit 1
          }
          for value in "$VIGIL_SHA" "$CONTEXT_GRAPH_SHA" "$CONTEXTDB_SHA"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "HAOS deploy artifact requires three exact commit identities" >&2
              exit 1
            }
          done
          test "$GITHUB_SHA" = "$VIGIL_SHA" || {
            echo "dev moved before HAOS artifact dispatch" >&2
            exit 1
          }

      - name: Checkout exact Vigil commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.vigil_sha }}
          fetch-depth: 0
          path: vigil
          persist-credentials: false
      - name: Checkout exact Context Graph commit
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ inputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false
      - name: Checkout exact ContextDB commit
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ inputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false
      - name: Prove clean current development tuple
        id: identity
        env:
          GH_TOKEN: ${{ secrets.CG_CI_TOKEN }}
          EXPECTED_VIGIL_SHA: ${{ inputs.vigil_sha }}
          EXPECTED_CONTEXT_GRAPH_SHA: ${{ inputs.context_graph_sha }}
          EXPECTED_CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
        run: |
          vigil_sha="$(git -C vigil rev-parse HEAD)"
          dev_sha="$(git -C vigil rev-parse origin/dev)"
          context_graph_sha="$(git -C context-graph rev-parse HEAD)"
          contextdb_sha="$(git -C contextdb rev-parse HEAD)"
          test "$vigil_sha" = "$EXPECTED_VIGIL_SHA"
          test "$vigil_sha" = "$dev_sha"
          test "$context_graph_sha" = "$EXPECTED_CONTEXT_GRAPH_SHA"
          test "$contextdb_sha" = "$EXPECTED_CONTEXTDB_SHA"
          test "$(gh api repos/context-graph-ai/context-graph/git/ref/heads/dev --jq '.object.sha')" = "$context_graph_sha"
          test "$(gh api repos/context-graph-ai/contextdb/git/ref/heads/dev --jq '.object.sha')" = "$contextdb_sha"
          test -z "$(git -C vigil status --porcelain=v1)"
          test -z "$(git -C context-graph status --porcelain=v1)"
          test -z "$(git -C contextdb status --porcelain=v1)"
          echo "vigil_sha=$vigil_sha" >> "$GITHUB_OUTPUT"
          echo "context_graph_sha=$context_graph_sha" >> "$GITHUB_OUTPUT"
          echo "contextdb_sha=$contextdb_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build exact HAOS musl binary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: exact-sources
    steps:
      - name: Checkout exact Vigil commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact-sources.outputs.vigil_sha }}
          path: vigil
          persist-credentials: false
      - name: Checkout exact Context Graph commit
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ needs.exact-sources.outputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false
      - name: Checkout exact ContextDB commit
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ needs.exact-sources.outputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false
      - name: Restore artifact build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vigil
          key: ${{ inputs.cache_epoch }}
      - name: Verify build disk capacity
        run: |
          mkdir -p vigil/target
          target_kb="$(du -sk vigil/target | awk '{print $1}')"
          available_kb="$(df --output=avail vigil/target | tail -n 1)"
          effective_capacity_kb=$((available_kb + target_kb))
          test "$available_kb" -ge 16777216
          test "$effective_capacity_kb" -ge 31457280
      - name: Install bounded musl-harness runtime tools
        run: |
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg mosquitto mosquitto-clients
      - name: Set up the exact musl harness
        working-directory: vigil
        run: ./scripts/verify workflow --step setup-harness
      - name: Add the HAOS musl target
        working-directory: vigil
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build and receipt the HAOS binary
        working-directory: vigil
        run: |
          ./scripts/verify dev-closeout \
            --lane install-binary \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state mixed \
            --receipt target/verify-receipts/dev-haos-artifact.json \
            --step build
      - name: Bind the artifact to its exact source tuple
        working-directory: vigil
        env:
          VIGIL_SHA: ${{ needs.exact-sources.outputs.vigil_sha }}
          CONTEXT_GRAPH_SHA: ${{ needs.exact-sources.outputs.context_graph_sha }}
          CONTEXTDB_SHA: ${{ needs.exact-sources.outputs.contextdb_sha }}
        run: |
          sha256sum target/x86_64-unknown-linux-musl/release/vigil > target/verify-receipts/dev-haos-artifact.sha256
          jq -n \
            --arg vigil_sha "$VIGIL_SHA" \
            --arg context_graph_sha "$CONTEXT_GRAPH_SHA" \
            --arg contextdb_sha "$CONTEXTDB_SHA" \
            --arg binary_sha256 "$(cut -d' ' -f1 target/verify-receipts/dev-haos-artifact.sha256)" \
            '{tier:"dev-haos-artifact",published:false,vigil_sha:$vigil_sha,context_graph_sha:$context_graph_sha,contextdb_sha:$contextdb_sha,binary_sha256:$binary_sha256}' \
            > target/verify-receipts/dev-haos-artifact-source.json
      - name: Upload the exact HAOS deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigil-haos-musl-${{ needs.exact-sources.outputs.vigil_sha }}
          path: |
            vigil/target/x86_64-unknown-linux-musl/release/vigil
            vigil/target/verify-receipts/dev-haos-artifact.json
            vigil/target/verify-receipts/dev-haos-artifact.sha256
            vigil/target/verify-receipts/dev-haos-artifact-source.json
          if-no-files-found: error
          retention-days: 90
