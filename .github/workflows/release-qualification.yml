name: Main release qualification

on:
  workflow_dispatch:
    inputs:
      vigil_sha:
        description: "Exact 40-character Vigil commit selected for main qualification"
        type: string
        required: true
      main_base_sha:
        description: "Exact current main SHA which the candidate must contain"
        type: string
        required: true
      closeout_run_id:
        description: "Successful dev-closeout workflow run for the exact Vigil/dependency tuple"
        type: string
        required: true
      context_graph_sha:
        description: "Exact known-good released Context Graph commit"
        type: string
        required: true
      contextdb_sha:
        description: "Exact known-good released ContextDB commit"
        type: string
        required: true
      cache_epoch:
        description: "Explicit Docker cache namespace; Rust clean qualification never restores a cache"
        type: string
        required: true
        default: "release-v1"

permissions:
  contents: read
  actions: read

concurrency:
  group: vigil-release-${{ inputs.vigil_sha }}-${{ inputs.context_graph_sha }}-${{ inputs.contextdb_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  NEXTEST_TEST_THREADS: 2

jobs:
  exact-sources:
    name: Verify immutable release source tuple
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vigil_sha: ${{ steps.identity.outputs.vigil_sha }}
      context_graph_sha: ${{ steps.identity.outputs.context_graph_sha }}
      contextdb_sha: ${{ steps.identity.outputs.contextdb_sha }}
    steps:
      - name: Require dispatch from the exact candidate workflow revision
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          VIGIL_SHA: ${{ inputs.vigil_sha }}
          MAIN_BASE_SHA: ${{ inputs.main_base_sha }}
          CONTEXT_GRAPH_SHA: ${{ inputs.context_graph_sha }}
          CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
          CLOSEOUT_RUN_ID: ${{ inputs.closeout_run_id }}
        run: |
          for value in "$VIGIL_SHA" "$MAIN_BASE_SHA" "$CONTEXT_GRAPH_SHA" "$CONTEXTDB_SHA"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "release qualification requires four full hexadecimal commit SHAs" >&2
              exit 1
            }
          done
          test "$WORKFLOW_SHA" = "$VIGIL_SHA" || {
            echo "dispatch the workflow from the exact Vigil candidate ref; workflow SHA $WORKFLOW_SHA differs from $VIGIL_SHA" >&2
            exit 1
          }
          [[ "$CLOSEOUT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "closeout_run_id must be a numeric workflow run ID" >&2
            exit 1
          }
      - name: Download exact prior dev-closeout source receipt
        uses: actions/download-artifact@v4
        with:
          name: dev-closeout-sources
          path: prior-closeout/source
          run-id: ${{ inputs.closeout_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact prior dev-closeout qualification
        uses: actions/download-artifact@v4
        with:
          name: dev-closeout-qualified-${{ inputs.vigil_sha }}
          path: prior-closeout/final
          run-id: ${{ inputs.closeout_run_id }}
          github-token: ${{ github.token }}
      - name: Bind release work to the successful dev closeout tuple
        env:
          VIGIL_SHA: ${{ inputs.vigil_sha }}
          CONTEXT_GRAPH_SHA: ${{ inputs.context_graph_sha }}
          CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
          CLOSEOUT_RUN_ID: ${{ inputs.closeout_run_id }}
        run: |
          jq -e --arg vigil "$VIGIL_SHA" --arg cg "$CONTEXT_GRAPH_SHA" --arg db "$CONTEXTDB_SHA" \
            '.vigil_sha == $vigil and .context_graph_sha == $cg and .contextdb_sha == $db and .clean == true' \
            prior-closeout/source/dev-closeout-sources.json >/dev/null
          jq -e --arg vigil "$VIGIL_SHA" --arg cg "$CONTEXT_GRAPH_SHA" --arg db "$CONTEXTDB_SHA" --arg run "$CLOSEOUT_RUN_ID" \
            '.qualified == true and .fast_forward_only == true and .vigil_sha == $vigil and .context_graph_sha == $cg and .contextdb_sha == $db and .workflow_run == $run' \
            prior-closeout/final/dev-closeout-qualified.json >/dev/null
      - name: Checkout exact Vigil candidate and history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.vigil_sha }}
          fetch-depth: 0
          path: vigil
          persist-credentials: false
      - name: Checkout exact Context Graph release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ inputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false
      - name: Checkout exact ContextDB release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ inputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false
      - name: Prove main ancestry, current main, and clean identities
        id: identity
        env:
          EXPECTED_VIGIL_SHA: ${{ inputs.vigil_sha }}
          EXPECTED_MAIN_BASE_SHA: ${{ inputs.main_base_sha }}
          EXPECTED_CONTEXT_GRAPH_SHA: ${{ inputs.context_graph_sha }}
          EXPECTED_CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
        run: |
          vigil_sha="$(git -C vigil rev-parse HEAD)"
          context_graph_sha="$(git -C context-graph rev-parse HEAD)"
          contextdb_sha="$(git -C contextdb rev-parse HEAD)"
          main_sha="$(git -C vigil rev-parse origin/main)"
          test "$vigil_sha" = "$EXPECTED_VIGIL_SHA"
          test "$main_sha" = "$EXPECTED_MAIN_BASE_SHA"
          test "$(git -C vigil merge-base "$vigil_sha" "$main_sha")" = "$main_sha"
          test "$context_graph_sha" = "$EXPECTED_CONTEXT_GRAPH_SHA"
          test "$contextdb_sha" = "$EXPECTED_CONTEXTDB_SHA"
          test -z "$(git -C vigil status --porcelain=v1)"
          test -z "$(git -C context-graph status --porcelain=v1)"
          test -z "$(git -C contextdb status --porcelain=v1)"
          echo "vigil_sha=$vigil_sha" >> "$GITHUB_OUTPUT"
          echo "context_graph_sha=$context_graph_sha" >> "$GITHUB_OUTPUT"
          echo "contextdb_sha=$contextdb_sha" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg vigil_sha "$vigil_sha" \
            --arg main_base_sha "$main_sha" \
            --arg context_graph_sha "$context_graph_sha" \
            --arg contextdb_sha "$contextdb_sha" \
            --arg closeout_run "${{ inputs.closeout_run_id }}" \
            '{tier:"release",workflow_sha:$workflow_sha,vigil_sha:$vigil_sha,main_base_sha:$main_base_sha,context_graph_sha:$context_graph_sha,contextdb_sha:$contextdb_sha,dev_closeout_run:$closeout_run,clean:true}' \
            > release-sources.json
      - name: Upload immutable release source receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-sources
          path: release-sources.json
          if-no-files-found: error
          retention-days: 90

  clean-qualification:
    name: Clean source qualification without Rust cache
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: exact-sources
    steps:
      - name: Checkout exact Vigil candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact-sources.outputs.vigil_sha }}
          path: vigil
          persist-credentials: false
      - name: Checkout exact Context Graph release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ needs.exact-sources.outputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false
      - name: Checkout exact ContextDB release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ needs.exact-sources.outputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false
      - name: Prove the clean leg starts without build outputs
        run: |
          test ! -e vigil/target
          test ! -e context-graph/target
          test ! -e contextdb/target
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install bounded runtime tools
        run: |
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg mosquitto mosquitto-clients
      - name: Set up runtime fixtures without restoring a Rust cache
        working-directory: vigil
        run: ./scripts/verify workflow --step runtime-harness
      - name: Verify clean default source behavior
        working-directory: vigil
        run: |
          ./scripts/verify release \
            --lane source \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state cold \
            --receipt target/verify-receipts/release-source.json \
            --step tests
      - name: Upload clean qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt-source
          path: vigil/target/verify-receipts/release-source.json
          if-no-files-found: error
          retention-days: 90

  static:
    name: Exact amd64 and arm64 static binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [exact-sources, clean-qualification]
    steps:
      - name: Free hosted-runner build disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h
      - name: Checkout exact Vigil candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact-sources.outputs.vigil_sha }}
          path: vigil
          persist-credentials: false
      - name: Checkout exact Context Graph release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ needs.exact-sources.outputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false
      - name: Checkout exact ContextDB release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ needs.exact-sources.outputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false
      - name: Verify static-build disk before compilation
        run: |
          mkdir -p vigil/target
          du -sh vigil/target || true
          target_kb="$(du -sk vigil/target | awk '{print $1}')"
          available_kb="$(df --output=avail vigil/target | tail -n 1)"
          effective_capacity_kb=$((available_kb + target_kb))
          scratch_floor_kb=16777216
          capacity_floor_kb=31457280
          if [ "${available_kb}" -lt "${scratch_floor_kb}" ] || \
             [ "${effective_capacity_kb}" -lt "${capacity_floor_kb}" ]; then
            echo "static release requires 16 GiB free scratch and 30 GiB free-plus-target capacity" >&2
            exit 1
          fi
          df -h vigil/target
      - name: Install bounded static-build tools
        run: |
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg mosquitto mosquitto-clients
      - name: Set up exact musl toolchains
        working-directory: vigil
        run: ./scripts/verify workflow --step setup-harness
      - name: Add exact Rust target libraries
        working-directory: vigil
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Build and receipt amd64 static binary
        working-directory: vigil
        run: |
          ./scripts/verify release \
            --lane static \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state cold \
            --receipt target/verify-receipts/release-static-amd64.json \
            --step amd64
      - name: Build and receipt arm64 static binary
        working-directory: vigil
        run: |
          ./scripts/verify release \
            --lane static \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state mixed \
            --receipt target/verify-receipts/release-static-arm64.json \
            --step arm64
      - name: Upload exact static binaries and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigil-static-musl-${{ needs.exact-sources.outputs.vigil_sha }}
          path: |
            vigil/target/x86_64-unknown-linux-musl/release/vigil
            vigil/target/aarch64-unknown-linux-musl/release/vigil
            vigil/target/verify-receipts/release-static-*.json
          if-no-files-found: error
          retention-days: 90

  static-image:
    name: Static fallback OCI install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [exact-sources, clean-qualification, static]
    steps:
      - name: Checkout exact Vigil candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact-sources.outputs.vigil_sha }}
          path: vigil
          persist-credentials: false
      - name: Checkout exact Context Graph release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ needs.exact-sources.outputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false
      - name: Checkout exact ContextDB release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ needs.exact-sources.outputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false
      - name: Download exact static binaries
        uses: actions/download-artifact@v4
        with:
          name: vigil-static-musl-${{ needs.exact-sources.outputs.vigil_sha }}
          path: static-download
      - name: Stage the Dockerfile allowlisted context
        run: |
          mkdir -p vigil/target/static-context/dist/docker/amd64 vigil/target/static-context/dist/docker/arm64
          amd64_binary="$(find static-download -path '*/x86_64-unknown-linux-musl/release/vigil' -type f -print -quit)"
          arm64_binary="$(find static-download -path '*/aarch64-unknown-linux-musl/release/vigil' -type f -print -quit)"
          test -n "$amd64_binary"
          test -n "$arm64_binary"
          install -m 0755 "$amd64_binary" vigil/target/static-context/dist/docker/amd64/vigil
          install -m 0755 "$arm64_binary" vigil/target/static-context/dist/docker/arm64/vigil
          install -m 0644 vigil/Dockerfile vigil/target/static-context/Dockerfile
          timeout --kill-after=30s 5m docker pull busybox:1.37.0-musl
      - name: Smoke the native static fallback image
        working-directory: vigil
        run: |
          docker build --tag "vigil-static-smoke:${{ needs.exact-sources.outputs.vigil_sha }}" target/static-context
          docker run --rm "vigil-static-smoke:${{ needs.exact-sources.outputs.vigil_sha }}" --help
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and receipt the exact multi-architecture fallback OCI
        working-directory: vigil
        run: |
          ./scripts/verify release \
            --lane image-install \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state cold \
            --receipt target/verify-receipts/release-static-image.json \
            -- docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --output type=oci,dest=target/vigil-static-fallback.oci.tar \
              target/static-context
      - name: Upload the installed static fallback OCI and receipt
        uses: actions/upload-artifact@v4
        with:
          name: vigil-static-fallback-${{ needs.exact-sources.outputs.vigil_sha }}
          path: |
            vigil/target/vigil-static-fallback.oci.tar
            vigil/target/verify-receipts/release-static-image.json
          if-no-files-found: error
          retention-days: 90

  hardware:
    name: Feature-complete hardware artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs: [exact-sources, clean-qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: amd64
            lane: artifact-amd64
            binary_target: vigil-hw-binary-amd64
            generic_target: vigil-generic-docker-hw-amd64
            addon_target: vigil-addon-hw-amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: arm64
            lane: artifact-arm64
            binary_target: vigil-hw-binary-arm64
            generic_target: vigil-generic-docker-hw-arm64
            addon_target: vigil-addon-hw-aarch64
    steps:
      - name: Free hosted-runner build disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h
      - name: Checkout exact Vigil candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact-sources.outputs.vigil_sha }}
          path: vigil
          persist-credentials: false
      - name: Checkout exact Context Graph release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/context-graph
          ref: ${{ needs.exact-sources.outputs.context_graph_sha }}
          path: context-graph
          token: ${{ secrets.CG_CI_TOKEN }}
          persist-credentials: false
      - name: Checkout exact ContextDB release
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ needs.exact-sources.outputs.contextdb_sha }}
          path: contextdb
          persist-credentials: false
      - name: Verify hardware-build disk
        run: |
          available_kb="$(df --output=avail . | tail -n 1)"
          if [ "${available_kb}" -lt 31457280 ]; then
            echo "hardware release requires at least 30 GiB free; found ${available_kb} KiB" >&2
            exit 1
          fi
          df -h .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Stage a bounded source context
        run: |
          mkdir -p release-context
          tar \
            --exclude='*/target' \
            --exclude='*/target/**' \
            --exclude='*/.vigil-tools-target' \
            --exclude='*/.vigil-tools-target/**' \
            --exclude='*/.git' \
            --exclude='*/.git/**' \
            --exclude='*/tests/fixtures/.cache' \
            --exclude='*/tests/fixtures/.cache/**' \
            -cf - vigil context-graph contextdb | tar -xf - -C release-context
      - name: Create architecture artifact directories
        run: mkdir -p "release-output/${{ matrix.arch }}/binary" "release-output/${{ matrix.arch }}/receipts"
      - name: Export and receipt the exact raw production binary
        working-directory: vigil
        run: |
          ./scripts/verify release \
            --lane "${{ matrix.lane }}" \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state mixed \
            --receipt "../release-output/${{ matrix.arch }}/receipts/raw.json" \
            -- docker buildx build \
              --platform "linux/${{ matrix.platform }}" \
              --target "${{ matrix.binary_target }}" \
              --file ../release-context/vigil/Dockerfile.hardware \
              --cache-from "type=gha,scope=vigil-release-${{ matrix.arch }}-${{ inputs.cache_epoch }}" \
              --output "type=local,dest=../release-output/${{ matrix.arch }}/binary" \
              ../release-context
      - name: Export and receipt the exact generic OCI image
        working-directory: vigil
        run: |
          ./scripts/verify release \
            --lane "${{ matrix.lane }}" \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state mixed \
            --receipt "../release-output/${{ matrix.arch }}/receipts/generic.json" \
            -- docker buildx build \
              --platform "linux/${{ matrix.platform }}" \
              --target "${{ matrix.generic_target }}" \
              --file ../release-context/vigil/Dockerfile.hardware \
              --cache-from "type=gha,scope=vigil-release-${{ matrix.arch }}-${{ inputs.cache_epoch }}" \
              --output "type=oci,dest=../release-output/${{ matrix.arch }}/vigil-generic-docker-hw-${{ matrix.arch }}.oci.tar" \
              ../release-context
      - name: Export and receipt the exact Home Assistant OCI image
        working-directory: vigil
        run: |
          ./scripts/verify release \
            --lane "${{ matrix.lane }}" \
            --vigil-sha "${{ needs.exact-sources.outputs.vigil_sha }}" \
            --context-graph-sha "${{ needs.exact-sources.outputs.context_graph_sha }}" \
            --contextdb-sha "${{ needs.exact-sources.outputs.contextdb_sha }}" \
            --cache-state mixed \
            --receipt "../release-output/${{ matrix.arch }}/receipts/addon.json" \
            -- docker buildx build \
              --platform "linux/${{ matrix.platform }}" \
              --target "${{ matrix.addon_target }}" \
              --file ../release-context/vigil/Dockerfile.hardware \
              --cache-from "type=gha,scope=vigil-release-${{ matrix.arch }}-${{ inputs.cache_epoch }}" \
              --cache-to "type=gha,mode=max,scope=vigil-release-${{ matrix.arch }}-${{ inputs.cache_epoch }}" \
              --output "type=oci,dest=../release-output/${{ matrix.arch }}/vigil-addon-hw-${{ matrix.arch }}.oci.tar" \
              ../release-context
      - name: Prove the complete architecture artifact set
        run: |
          test -x "release-output/${{ matrix.arch }}/binary/vigil"
          test -s "release-output/${{ matrix.arch }}/vigil-generic-docker-hw-${{ matrix.arch }}.oci.tar"
          test -s "release-output/${{ matrix.arch }}/vigil-addon-hw-${{ matrix.arch }}.oci.tar"
          test "$(find "release-output/${{ matrix.arch }}/receipts" -name '*.json' | wc -l)" -eq 3
      - name: Install bounded OCI inspection tools
        run: |
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout --kill-after=30s 5m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y skopeo
      - name: Install and smoke the exact artifact outputs
        run: |
          "release-output/${{ matrix.arch }}/binary/vigil" --help
          generic_archive="release-output/${{ matrix.arch }}/vigil-generic-docker-hw-${{ matrix.arch }}.oci.tar"
          addon_archive="release-output/${{ matrix.arch }}/vigil-addon-hw-${{ matrix.arch }}.oci.tar"
          skopeo inspect "oci-archive:${generic_archive}" >/dev/null
          skopeo inspect "oci-archive:${addon_archive}" >/dev/null
          skopeo copy "oci-archive:${generic_archive}" "docker-daemon:vigil-generic-smoke:${{ matrix.arch }}"
          skopeo copy "oci-archive:${addon_archive}" "docker-daemon:vigil-addon-smoke:${{ matrix.arch }}"
          docker run --rm --entrypoint /usr/local/bin/vigil "vigil-generic-smoke:${{ matrix.arch }}" --help
          docker run --rm --entrypoint /usr/local/bin/vigil "vigil-addon-smoke:${{ matrix.arch }}" --help
      - name: Upload exact feature-complete artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigil-production-${{ matrix.arch }}-${{ needs.exact-sources.outputs.vigil_sha }}
          path: release-output/${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  release-qualified:
    name: Qualified artifacts, not published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [exact-sources, clean-qualification, static, static-image, hardware]
    steps:
      - name: Require qualification before accepting artifacts
        run: |
          test "${{ needs.exact-sources.result }}" = "success"
          test "${{ needs.clean-qualification.result }}" = "success"
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.static-image.result }}" = "success"
          test "${{ needs.hardware.result }}" = "success"
      - name: Download exact release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vigil-*
          path: artifacts
      - name: Record artifact hashes without publishing
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > release-artifacts.sha256
          jq -n \
            --arg vigil_sha "${{ inputs.vigil_sha }}" \
            --arg context_graph_sha "${{ inputs.context_graph_sha }}" \
            --arg contextdb_sha "${{ inputs.contextdb_sha }}" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            '{tier:"release",qualified:true,published:false,vigil_sha:$vigil_sha,context_graph_sha:$context_graph_sha,contextdb_sha:$contextdb_sha,workflow_run:$workflow_run}' \
            > release-qualified.json
      - name: Upload non-publishing release receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-qualified-${{ inputs.vigil_sha }}
          path: |
            release-qualified.json
            release-artifacts.sha256
          if-no-files-found: error
          retention-days: 90
