[package]
name = "vigil-acceptance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "2"
members = ["crates/vigil"]
default-members = ["crates/vigil"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["John Cyriac <lucidprogrammer@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/context-graph-ai/vigil"
description = "Local-first Home Assistant camera intelligence daemon"
keywords = ["home-assistant", "camera", "nvr", "local-first"]
categories = ["command-line-utilities"]

[workspace.dependencies]
context-graph = { path = "../context-graph/crates/context-graph", default-features = false }
burn = { version = "0.21.0", default-features = false }
burn-flex = { version = "0.21.0" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
libc = "0.2"
retina = { version = "0.4.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
syn = { version = "2", features = ["full"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "rt", "time"] }
toml = "0.9"
url = "2.5"
yolox-burn = { git = "https://github.com/tracel-ai/models.git", rev = "ec1b9e42e6692ef2b95f85c4ba783e07cd3d19af", package = "yolox-burn", features = ["pretrained"] }

[dependencies]
context-graph.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-commit-message = "release: v{{version}}"
pre-release-replacements = [
  { file = "addons/vigil/config.yaml", search = 'version: "[^"]+"', replace = 'version: "{{version}}"', min = 1 },
]
publish = false
push = true

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"

[[bin]]
name = "vigil-store-probe"
path = "tests/ha-os-vm/store_probe.rs"
