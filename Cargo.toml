[package]
name = "vigil-acceptance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "2"
members = ["crates/vigil", "xtask"]
default-members = ["crates/vigil"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["John Cyriac <lucidprogrammer@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/context-graph-ai/vigil"
description = "Local-first Home Assistant camera intelligence daemon"
keywords = ["home-assistant", "camera", "nvr", "local-first"]
categories = ["command-line-utilities"]

[workspace.dependencies]
context-graph = { path = "../context-graph/crates/context-graph", default-features = false }
cg-vision-embedder = { path = "../context-graph/crates/cg-vision-embedder" }
burn = { version = "0.21.0", default-features = false }
burn-flex = { version = "0.21.0" }
burn-store = { version = "0.21.0", default-features = false, features = ["std", "pytorch"] }
# Accelerated detection backend (feature-gated; native artifacts only — the
# default static-musl build never compiles these). `vulkan` pulls in the
# SPIR-V compute-kernel compiler cubecl needs to actually run on Vulkan.
burn-wgpu = { version = "0.21.0", features = ["vulkan"] }
wgpu = "29"
pollster = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
imageproc = { version = "0.27.0", default-features = false }
libc = "0.2"
mp4 = "0.14.0"
openh264 = { version = "0.9.3", default-features = false, features = ["source"] }
retina = { version = "0.4.19", default-features = false, features = ["h265"] }
rumqttc = "0"
rust_h265 = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["net", "rt", "time"] }
toml = "0.9"
url = "2.5"
uuid = { version = "1", features = ["v4", "v7"] }
# Hardware decode backend (feature-gated; native artifacts only — the
# default static-musl build never compiles these).
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
yolox-burn = { git = "https://github.com/tracel-ai/models.git", rev = "ec1b9e42e6692ef2b95f85c4ba783e07cd3d19af", package = "yolox-burn" }
# Fabric integration (vigil-distributed-compute): the shared contextdb work
# ledger + iroh transport, consumed directly behind vigil's default-off
# `fabric` feature (Design decision A — cg's own fabric.rs is work-class-#1
# glue and would drag the understanding surface in for zero reuse; vigil
# authors only its payloads/executor/policy, per the placement rule).
contextdb-server = { path = "../contextdb/crates/contextdb-server", default-features = false, features = [
  "iroh",
] }
contextdb-engine = { path = "../contextdb/crates/contextdb-engine" }
contextdb-core = { path = "../contextdb/crates/contextdb-core" }

[dependencies]
context-graph.workspace = true
libc.workspace = true

[features]
default = []
# Slow installable/container/camera acceptance. Keep this out of the default
# workspace gate; run with `cargo test-acceptance`.
acceptance = []

[dev-dependencies]
tempfile.workspace = true

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-commit-message = "release: v{{version}}"
pre-release-replacements = [
  { file = "addons/vigil/config.yaml", search = 'version: "[^"]+"', replace = 'version: "{{version}}"', min = 1 },
]
publish = false
push = true

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["acceptance"]

[[bin]]
name = "vigil-store-probe"
path = "tests/ha-os-vm/store_probe.rs"
