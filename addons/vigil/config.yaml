name: Vigil
slug: vigil
version: "0.1.0"
description: Local Vigil substrate runtime
startup: services
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:8099]/health"
arch:
  - amd64
  - aarch64
ports:
  8099/tcp: 8099
  8098/tcp: 8098
ports_description:
  8099/tcp: Health endpoint
  8098/tcp: Review data plane
# Declare the HA Mosquitto broker as an optional service dependency.
# When the Mosquitto add-on is installed and running, Vigil discovers the broker
# credentials at startup by calling the Supervisor services API
# (GET http://supervisor/services/mqtt via SUPERVISOR_TOKEN).
# Explicit env vars MQTT_HOST / MQTT_PORT / MQTT_USER / MQTT_PASSWORD are
# accepted as a fallback for non-Supervisor deployments.
services:
  - mqtt:want
# Behavior settings deliberately declare NO defaults here.
#
# The Supervisor cannot show anyone the difference between an option nobody
# touched and one typed to the same value as the declared default, and the web
# interface posts the whole rendered form on save. A declared default therefore
# turns every fresh install into a screenful of values that look like a person
# set them — which would switch off automatic tuning and refuse a management
# server's value for each of them. Removing such a key from the user's record
# does not produce absence either; the Supervisor refills the declared default,
# so there would be no way to say "nothing is set here" at all.
#
# What stays: the store location, because a store cannot say where the store
# is; the enrollment credential; and the camera list, which is not a setting.
# Every behavior default is Vigil's own, and the operator surface names Vigil as
# the author of each until somebody sets one.
options:
  store_path: /data/store.contextgraph
  fabric_ticket: ""
  cameras: []
# Every behavior key is declared optional, so an unset key is genuinely absent
# from the file Vigil reads and clearing one means "this surface no longer says
# anything about this setting" rather than "put the packaged default back".
schema:
  store_path: str
  site_name: str?
  health_port: int?
  review_port: int?
  detector_model_id: str?
  detector_model_path: str?
  detector_stationary_interval_secs: int?
  recognition_weights_dir: str?
  recognition_space_id: str?
  recognition_threshold: float?
  # What Vigil looks for, and what recognition puts a name to, are two
  # separate choices an operator makes. One key serving both would mean a
  # person who widens recognition silently widens what the machine detects,
  # and a person who wants vehicles detected without recognizing anything
  # would have no field to say it in.
  #
  # Both are a loose list of strings, never an enumeration of the model's
  # classes. Vigil validates detector_classes entries at write time against
  # the bundled detector's compiled class inventory, not a loaded model
  # instance, naming any entry it does not carry; that inventory changes only
  # when the compiled-in detector changes, which today means a packaging
  # release.
  detector_classes:
    - str?
  recognition_covered_classes:
    - str?
  cameras:
    - name: str
      rtsp_url: str?
      live_rtsp_url: str?
      username: str?
      password: str?
      usb_device: str?
      csi_module: str?
      mjpeg_url: str?
      # A camera whose own value is set runs it; every other camera keeps
      # running the value the whole deployment inherits, so turning the
      # driveway down for a tree in the wind does not turn the site down.
      motion_sensitivity: int?
  # The deployment-wide value every camera without one of its own runs at.
  motion_sensitivity: int?
  hardware_decoding: bool?
  accelerated_detection: bool?
  decode_probe_deadline_secs: int?
  hardware_probe_deadline_secs: int?
  rtsp_retry_initial_ms: int?
  rtsp_retry_max_ms: int?
  # Whether Vigil, having mirrored a value onto this page, also takes the
  # restart that makes the container's own copy of this file agree. Mirroring
  # itself is free and unconditional; only the restart is governed here.
  restart_on_reflect: bool?
  # The controls an operator reaches for when the machine cannot keep up.
  # Widening the class set with nothing to adjust would be a dead end, so these
  # three get a Home Assistant surface rather than living only in the runtime.
  detector_queue_capacity: int?
  detector_sample_frames: int?
  detector_confidence_threshold: float?
  # The two values automatic management chooses, so turning that automation off
  # leaves something to set. Loose strings, never a list of backend names: which
  # backends exist is a property of the build — the accelerated one is compiled
  # in or it is not — and Vigil refuses a backend this artifact does not carry,
  # naming what it does.
  detection_backend: str?
  decode_backend: str?
  fabric_ticket: str?
  fabric_hub: bool?
  fabric_allow_frame_offload: bool?
  fabric_worker_lease_ms: int?
  fabric_fallback_horizon_ms: int?
  keyframe_interval_fps_multiplier: int?
  keyframe_interval_min_frames: int?
  keyframe_interval_max_frames: int?
  bitrate_bps_up_to_640x480: int?
  bitrate_bps_up_to_1280x720: int?
  bitrate_bps_up_to_1920x1080: int?
  bitrate_bps_up_to_2560x1440: int?
  bitrate_bps_above_2560x1440: int?
apparmor: true
# Host networking is REQUIRED for the fabric (distributed compute): the iroh
# sync/blob endpoint is QUIC over UDP on a dynamically bound port, and the
# fabric-join ticket advertises this node's discovered interface addresses.
# Behind the default container network the ticket advertises the unreachable
# container-internal bridge address and every worker dial times out — no port
# mapping can fix a dynamically bound UDP port. Same pattern as other NVR
# add-ons (e.g. Frigate).
host_network: true
host_pid: false
# Narrow DRM render-node mapping for hardware video decode (hardware_decoding).
# Never full_access and never the whole /dev/dri tree — only the render node.
devices:
  - /dev/dri/renderD128:/dev/dri/renderD128:rwm
# Required for Supervisor REST API access to MQTT credentials and Generic Camera
# config-flow registration, and for SUPERVISOR_TOKEN injection.
homeassistant_api: true
# Supervisor API access, so Vigil can write its OWN add-on options with its own
# container's token. Without it the options page keeps showing the old value
# after a management server changes one, and the surface a user trusts most is
# the one telling them something untrue. The ordinary role already permits an
# add-on to write its own options — measured empirically against a live
# Supervisor with this container's own token, where a complete self-options
# write succeeded at this role.
hassio_api: true
hassio_role: default
