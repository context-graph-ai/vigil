name: Vigil
slug: vigil
version: "0.1.0"
description: Local Vigil substrate runtime
startup: services
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:8099]/health"
arch:
  - amd64
  - aarch64
ports:
  8099/tcp: 8099
  8098/tcp: 8098
ports_description:
  8099/tcp: Health endpoint
  8098/tcp: Review data plane
# Declare the HA Mosquitto broker as an optional service dependency.
# When the Mosquitto add-on is installed and running, Vigil discovers the broker
# credentials at startup by calling the Supervisor services API
# (GET http://supervisor/services/mqtt via SUPERVISOR_TOKEN).
# Explicit env vars MQTT_HOST / MQTT_PORT / MQTT_USER / MQTT_PASSWORD are
# accepted as a fallback for non-Supervisor deployments.
services:
  - mqtt:want
options:
  store_path: /data/store.contextgraph
  health_port: 8099
  review_port: 8098
  detector_stationary_interval_secs: 30
  recognition_space_id: vigil_site_vision_v1
  recognition_threshold: 0.6
  recognition_covered_classes:
    - person
    - dog
  cameras: []
  hardware_decoding: true
  accelerated_detection: true
schema:
  store_path: str
  health_port: int
  review_port: int
  detector_model_path: str?
  detector_stationary_interval_secs: int
  recognition_weights_dir: str?
  recognition_space_id: str?
  recognition_threshold: float?
  recognition_covered_classes:
    - "list(person|dog|cat|bird|horse|sheep|cow|car|truck|bus|motorcycle|bicycle)"
  cameras:
    - name: str
      rtsp_url: str?
      live_rtsp_url: str?
      username: str?
      password: str?
  hardware_decoding: bool
  accelerated_detection: bool
apparmor: true
host_network: false
host_pid: false
# Narrow DRM render-node mapping for hardware video decode (hardware_decoding).
# Never full_access and never the whole /dev/dri tree — only the render node.
devices:
  - /dev/dri/renderD128:/dev/dri/renderD128:rwm
# Required for Supervisor REST API access to MQTT credentials and Generic Camera
# config-flow registration, and for SUPERVISOR_TOKEN injection.
homeassistant_api: true
