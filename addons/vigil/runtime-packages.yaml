# Single-source runtime package manifest for every installable Vigil
# artifact shape. The add-on Dockerfile's shipped image stage expands its
# `apk add` package list from this file (selected by the Home Assistant
# `BUILD_ARCH` value); the top-level generic Dockerfile's hardware runtime
# stages install the matching literal package set; the release notes name
# the resulting artifact identifiers. Nothing here is fetched at container
# start — every package bakes into the image at build time.
#
# RUNTIME packages only — toolchain/build packages (rust, cargo, pkgconf,
# build-base, gstreamer-dev, gst-plugins-base-dev, ...) are a builder-stage
# concern and never ship in the final image, so they are deliberately absent
# here: the manifest is the single source for what the SHIPPED image
# actually carries, not for how it was compiled.
#
# Backend vocabulary: decode_backend in {software, gstreamer}; detector_backend
# in {burn-cpu, burn-wgpu}. The hardware artifacts now carry burn-wgpu — the
# accelerated (wgpu -> Vulkan) object detector — and fall back to CPU
# honestly on a box with no usable GPU. The static-musl artifact stays
# software decode + burn-cpu.
#
# Package sets were verified against the real base images with:
#   docker run --rm <base> sh -c 'apk update; apk search -e <name>'
# amd64 uses Intel VA-API (libva-intel-driver / intel-media-driver +
# mesa-va-gallium); aarch64 uses the generic Mesa/V4L2 GStreamer stack
# (no Intel-only VA driver exists for aarch64). The Vulkan runtime is the
# loader (dlopen'd by wgpu at startup) plus the real GPU ICDs for the arch:
# amd64 ships the Intel (ANV) and AMD (RADV) drivers; aarch64 ships the AMD,
# Broadcom, Panfrost, and Freedreno drivers (mesa-vulkan-intel has no aarch64
# build). The software rasterizer (mesa-vulkan-swrast / lavapipe) is never
# shipped — the detection receipt downgrades a software Vulkan adapter to the
# honest CPU fallback, so shipping it would advertise acceleration a box can
# never actually get.
profiles:
- name: vigil-addon-hw-amd64
  base: ghcr.io/home-assistant/base:3.22
  arch: amd64
  artifact: addon
  hardware_enabled: true
  decode_backend: gstreamer
  detector_backend: burn-wgpu
  packages:
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    - gst-plugins-bad
    - gst-vaapi
    - libva
    - libva-intel-driver
    - intel-media-driver
    - mesa-va-gallium
    - vulkan-loader
    - mesa-vulkan-intel
    - mesa-vulkan-ati
- name: vigil-addon-hw-aarch64
  base: ghcr.io/home-assistant/base:3.22
  arch: aarch64
  artifact: addon
  hardware_enabled: true
  decode_backend: gstreamer
  detector_backend: burn-wgpu
  packages:
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    - gst-plugins-bad
    - libva
    - mesa-va-gallium
    - mesa-dri-gallium
    - vulkan-loader
    - mesa-vulkan-ati
    - mesa-vulkan-broadcom
    - mesa-vulkan-panfrost
    - mesa-vulkan-freedreno
- name: vigil-generic-docker-hw-amd64
  base: alpine:3.22
  arch: amd64
  artifact: generic-docker
  hardware_enabled: true
  decode_backend: gstreamer
  detector_backend: burn-wgpu
  packages:
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    - gst-plugins-bad
    - gst-vaapi
    - libva
    - libva-intel-driver
    - intel-media-driver
    - mesa-va-gallium
    - vulkan-loader
    - mesa-vulkan-intel
    - mesa-vulkan-ati
- name: vigil-generic-docker-hw-arm64
  base: alpine:3.22
  arch: aarch64
  artifact: generic-docker
  hardware_enabled: true
  decode_backend: gstreamer
  detector_backend: burn-wgpu
  packages:
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    - gst-plugins-bad
    - libva
    - mesa-va-gallium
    - mesa-dri-gallium
    - vulkan-loader
    - mesa-vulkan-ati
    - mesa-vulkan-broadcom
    - mesa-vulkan-panfrost
    - mesa-vulkan-freedreno
- name: vigil-static-musl
  base: scratch
  arch: amd64
  artifact: static-musl
  hardware_enabled: false
  decode_backend: software
  detector_backend: burn-cpu
  packages: []
