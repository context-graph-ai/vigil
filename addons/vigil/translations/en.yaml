configuration:
  store_path:
    description: "Where Vigil's context-graph store lives on disk. A store cannot say where itself is, so this has no packaged default and must be set; the add-on ships it as /data/store.contextgraph."
  site_name:
    description: "The site or context name this Vigil node reports events and settings under. Defaults to site-1."
  health_port:
    description: "The TCP port Vigil's health endpoint listens on. Defaults to 8099."
  review_port:
    description: "The TCP port Vigil's review and media data-plane endpoint listens on. Defaults to 8098."
  detector_model_id:
    description: "The model identifier written into detector-config provenance for each detection. Defaults to yolox-tiny-burn-cpu."
  detector_model_path:
    description: "An optional local checkpoint path for the object detector to load instead of the bundled weights. Leave unset to use the bundled model."
  detector_stationary_interval_secs:
    description: "How often, in seconds, Vigil re-scans an otherwise motion-free scene for a stationary person or object. Defaults to 30; set to 0 to only look on movement."
  recognition_weights_dir:
    description: "A local directory of staged SigLIP recognition weights. Recognition is off until this is set; leave unset to keep recognition disabled."
  recognition_space_id:
    description: "The embedding-space identifier recognition matches face/object references against. Required only when recognition_weights_dir is set."
  recognition_threshold:
    description: "The similarity score a recognition match must clear to be reported. Must be between 0.0 and 1.0; defaults to 0.90."
  detector_classes:
    description: "Which object classes the detector looks for, as a loose list of class names (for example person, dog, car). Validated against the bundled detector's compiled class set; defaults to person alone."
  recognition_covered_classes:
    description: "Which of the detected classes recognition also attempts to put a name to, as a loose list of class names. Defaults to person and dog when unset. Independent of detector_classes — widening this does not widen what the detector looks for."
  cameras:
    description: "The list of cameras this node runs, each with its own name, stream source, and optional per-camera overrides (for example motion_sensitivity)."
  motion_sensitivity:
    description: "The deployment-wide motion sensitivity every camera uses unless it sets its own, on a 1-10 scale. Defaults to 5."
  hardware_probe_deadline_secs:
    description: "How long the startup hardware-decode probe waits to collect a buffer of real stream units before deciding on whatever it has, so a low-fps camera still gets a backend decision instead of hanging. Defaults to 10 seconds."
  rtsp_retry_initial_ms:
    description: "How long, in milliseconds, Vigil waits before the first reconnect attempt after a camera stream drops. Defaults to 2000; doubles on each further attempt up to rtsp_retry_max_ms."
  rtsp_retry_max_ms:
    description: "The longest gap, in milliseconds, between reconnect attempts after a camera stream drops. Defaults to 30000."
  restart_on_reflect:
    description: "Whether Vigil also triggers a container restart when it mirrors an effective value back onto this options page, so the running container's own copy of the file catches up immediately. Defaults on; turned off, the value is still mirrored here but the container keeps the old value until the next restart."
  detector_queue_capacity:
    description: "How many segments the detector's work queue holds before newer work replaces older, for when the machine cannot keep up. Defaults to 1."
  detector_sample_frames:
    description: "How many frames Vigil samples per motion-positive segment for detection. Must be between 1 and 64; defaults to 5."
  detector_confidence_threshold:
    description: "The minimum detector confidence, from 0.0 to 1.0, a result must clear to be emitted as a detection. Defaults to 0.5."
  detection_backend:
    description: "Pin which detection backend runs (for example burn-cpu or burn-wgpu), or leave unset to let Vigil probe and choose automatically. A pin naming a backend this artifact does not carry is refused."
  decode_backend:
    description: "Pin which decode backend runs (software or hardware), or leave unset to let Vigil probe and choose automatically. A pin naming a backend this artifact does not carry is refused; pinning hardware still goes through the probe before it is used."
  fabric_worker_lease_ms:
    description: "How long, in milliseconds, this node reserves offloaded fabric detector work before treating the lease as expired. Defaults to 300000 (five minutes)."
  fabric_fallback_horizon_ms:
    description: "How long, in milliseconds, this node waits for a remote fabric result before falling back to running detection locally. Defaults to 5000."
  hardware_decoding:
    description: "Use the mapped graphics device for hardware video decode. Defaults on; falls back to software decode automatically if no device is mapped or reachable."
  accelerated_detection:
    description: "Defaults on. Accelerates object detection on a usable GPU, and falls back to CPU detection with a receipt naming why when no usable GPU is present."
  decode_probe_deadline_secs:
    description: "How long the startup hardware decode probe waits for the mapped graphics device before it falls back to software decode. Vigil's own value is 5 seconds; leave this unset to keep it, and the setting reads Automatic. Setting it here records it as the decode_probe_deadline_secs setting, attributed to the add-on options, and it takes effect at the next start; you can also set it in the config file or with `vigil settings set decode_probe_deadline_secs`. A slow decoder cold start that times out says so, and names this setting."
  fabric_ticket:
    description: "Paste the join ticket printed by another Vigil node's status output here to join its distributed compute fabric, so this node can offload detection work to (or accept offloaded work from) that node under queue pressure. Leave blank to run standalone; a malformed ticket is reported with the fix and this node keeps running standalone."
  fabric_hub:
    description: "Turn this node into the fabric hub that other Vigil nodes join by pasting its ticket. Defaults off, so no new network listener opens on an existing install. Once enabled, this node's status and doctor output print the join ticket to share with other nodes."
  fabric_allow_frame_offload:
    description: "Once joined to a fabric, an ephemeral compressed clip of a motion event from THIS camera moves to same-tenant Vigil nodes by default when this node's detector queue is under pressure. Turn this off to keep this camera's clips on this node always, even while still joined (this node can still accept offloaded work from other nodes)."
  keyframe_interval_fps_multiplier:
    description: "How often a recorded/live video stream inserts a full picture an app can start playback from, expressed as a multiple of the camera's own frame rate. Left alone, Vigil inserts one every 2 seconds' worth of frames, so opening a live view or scrubbing a recording never waits long for a playable point. Raising this number makes that wait longer but shrinks file size slightly; lowering it (down to 1) makes playback start faster at a small file-size cost."
  keyframe_interval_min_frames:
    description: "The shortest gap Vigil will ever leave between those playback-start points, in frames, no matter how slow a camera's frame rate is. Left alone this is 15 frames, so even a very low-frame-rate camera still gets a full picture inserted often enough to join or scrub smoothly."
  keyframe_interval_max_frames:
    description: "The longest gap Vigil will ever leave between those playback-start points, in frames, no matter how fast a camera's frame rate is. Left alone this is 300 frames, capping how long a viewer could wait to start playback on a very high-frame-rate camera."
  bitrate_bps_up_to_640x480:
    description: "How much data per second Vigil spends encoding video at 640x480 resolution or smaller. Left alone this is 1 Mbps, a size chosen to look reasonable at that resolution without wasting storage. Raising it improves picture quality at the cost of more storage and network use; lowering it saves storage at the cost of a blockier picture."
  bitrate_bps_up_to_1280x720:
    description: "How much data per second Vigil spends encoding video above 640x480 and up to 1280x720 (HD) resolution. Left alone this is 2 Mbps. Raising it improves picture quality at the cost of more storage and network use; lowering it saves storage at the cost of a blockier picture."
  bitrate_bps_up_to_1920x1080:
    description: "How much data per second Vigil spends encoding video above 1280x720 and up to 1920x1080 (Full HD) resolution. Left alone this is 4 Mbps. Raising it improves picture quality at the cost of more storage and network use; lowering it saves storage at the cost of a blockier picture."
  bitrate_bps_up_to_2560x1440:
    description: "How much data per second Vigil spends encoding video above 1920x1080 and up to 2560x1440 (2K) resolution. Left alone this is 6 Mbps. Raising it improves picture quality at the cost of more storage and network use; lowering it saves storage at the cost of a blockier picture."
  bitrate_bps_above_2560x1440:
    description: "How much data per second Vigil spends encoding video above 2560x1440 resolution. Left alone this is 10 Mbps. Raising it improves picture quality at the cost of more storage and network use; lowering it saves storage at the cost of a blockier picture."
