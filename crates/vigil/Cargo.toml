[package]
name = "vigil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vigil"
path = "src/main.rs"

[[bin]]
name = "yolox-burn-oracle"
path = "src/bin/yolox_burn_oracle.rs"

[dependencies]
burn.workspace = true
burn-flex.workspace = true
burn-store.workspace = true
chrono.workspace = true
context-graph.workspace = true
cg-vision-embedder.workspace = true
futures-util.workspace = true
image.workspace = true
imageproc.workspace = true
libc.workspace = true
mp4.workspace = true
openh264.workspace = true
retina.workspace = true
rumqttc.workspace = true
rust_h265.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
tiny_http.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
yolox-burn.workspace = true
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
burn-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
default = []
# Hardware video decode through the system GStreamer stack. Compiled only
# into native (dynamically linked) artifacts; the static-musl artifact stays
# software-only and reports unsupported_by_this_artifact honestly.
decode-gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Experimental accelerated object detection backend: a Burn wgpu/Vulkan
# backend below the `Detector` trait, native artifacts only. The CPU-only
# artifact (every shipped shape) keeps this feature disabled and stays on
# burn-cpu.
detect-burn-wgpu = ["dep:burn-wgpu", "dep:wgpu", "dep:pollster"]
# Slow deterministic camera/detector first-light acceptance. Keep this out of
# the default workspace gate; run with `cargo test-first-light`.
first-light-acceptance = []

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true

[[test]]
name = "first_light_loop"
path = "tests/first_light_loop.rs"
required-features = ["first-light-acceptance"]

[[test]]
name = "ha_correction_seam"
path = "tests/ha_correction_seam.rs"
required-features = ["first-light-acceptance"]

[[test]]
name = "http_data_plane"
path = "tests/http_data_plane.rs"

[[test]]
name = "ha_mqtt_broker"
path = "tests/ha_mqtt_broker.rs"
