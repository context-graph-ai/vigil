[package]
name = "vigil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "yolox-burn-oracle"
path = "src/bin/yolox_burn_oracle.rs"

[dependencies]
burn.workspace = true
burn-flex.workspace = true
burn-store.workspace = true
bytes.workspace = true
chrono.workspace = true
context-graph.workspace = true
contextdb-core.workspace = true
cg-vision-embedder.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
image.workspace = true
imageproc.workspace = true
libc.workspace = true
mp4.workspace = true
openh264.workspace = true
retina.workspace = true
rust_h265.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
tiny_http.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
yolox-burn.workspace = true
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
burn-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
contextdb-server = { workspace = true, optional = true }
contextdb-engine = { workspace = true, optional = true }

[features]
default = []
# Hardware video decode through the system GStreamer stack. Compiled only
# into native (dynamically linked) artifacts; the static-musl artifact stays
# software-only and reports unsupported_by_this_artifact honestly.
decode-gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Experimental accelerated object detection backend: a Burn wgpu/Vulkan
# backend below the `Detector` trait, native artifacts only. The CPU-only
# artifact (every shipped shape) keeps this feature disabled and stays on
# burn-cpu.
detect-burn-wgpu = ["dep:burn-wgpu", "dep:wgpu", "dep:pollster"]
# Slow deterministic camera/detector first-light acceptance. Keep this out of
# the default workspace gate; run with `cargo test-first-light`.
first-light-acceptance = []
# The hub-role door: opening this deployment's store as a management server
# and authoring at the pushed rank. It exists so the harness can act as the
# hub a node would otherwise only meet over sync. No artifact enables it, so
# in every shipped build those entry points are not merely private — they are
# not compiled at all, and nothing on this node can author a fleet
# instruction nobody in the fleet issued.
test-support = []
# Distributed compute fabric (vigil-distributed-compute): embeds
# contextdb-server's shared work ledger + iroh transport so this vigil node
# can submit/claim/execute `vigil.detector` jobs with other enrolled nodes.
# Default-off: a build without this feature links no sync/iroh/ledger code
# at all (today's behavior, byte-identical).
fabric = ["dep:contextdb-server", "dep:contextdb-engine"]

[dev-dependencies]
contextdb-server = { workspace = true, features = ["test-seams"] }
tempfile.workspace = true
# The harness's own door onto the hub-role handle. A test stands a management
# server up against a deployment directory; a shipped artifact never can,
# because no artifact builds this feature and the door does not exist in one.
# Depending on this crate from its own tests is what turns the feature on for
# the test build and leaves every artifact build without it.
vigil = { path = ".", features = ["test-support"] }
unicode-ident.workspace = true
uuid.workspace = true
# The settings-surface-coverage guard test binds its documentation check to
# a specific contract-bearing paragraph by calling the SAME paragraph-
# boundary parser the doc-claim registry already freezes a hash of
# (`xtask::test_estate::adjacent_paragraph`), rather than re-implementing
# that backward scan a second time. Dev-only: no production code depends
# on xtask.
xtask = { path = "../../xtask" }

[[test]]
name = "ha_correction_seam"
path = "tests/ha_correction_seam.rs"
required-features = ["first-light-acceptance"]

[[test]]
name = "http_data_plane"
path = "tests/http_data_plane.rs"
