[package]
name = "vigil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vigil"
path = "src/main.rs"

[[bin]]
name = "yolox-burn-oracle"
path = "src/bin/yolox_burn_oracle.rs"

[dependencies]
burn.workspace = true
burn-flex.workspace = true
burn-store.workspace = true
chrono.workspace = true
context-graph.workspace = true
futures-util.workspace = true
image.workspace = true
imageproc.workspace = true
libc.workspace = true
mp4.workspace = true
openh264.workspace = true
retina.workspace = true
rust_h265.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
yolox-burn.workspace = true

[features]
default = []
# Slow deterministic camera/detector first-light acceptance. Keep this out of
# the default workspace gate; run with `cargo test-first-light`.
first-light-acceptance = []

[dev-dependencies]
syn.workspace = true
tempfile.workspace = true

[[test]]
name = "first_light_loop"
path = "tests/first_light_loop.rs"
required-features = ["first-light-acceptance"]
