<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vigil browser review data-plane check</title>
</head>
<body data-status="RUNNING">
<script>
const params = new URLSearchParams(window.location.search);
const base = params.get("base");

function joinBase(ref) {
  return new URL(ref || "/", base).href;
}

function fail(message) {
  document.body.dataset.status = "FAIL";
  document.body.textContent = `FAIL ${message}`;
}

function pass() {
  document.body.dataset.status = "PASS";
  document.body.textContent = "PASS";
}

function assertOk(condition, message) {
  if (!condition) {
    throw new Error(message);
  }
}

async function run() {
  try {
    assertOk(base, "missing Vigil review base URL");
    try {
      await fetch(joinBase("/events"));
      fail("foreign-origin /events fetch succeeded; the same-origin review contract was bypassed");
    } catch (error) {
      assertOk(error instanceof TypeError, `unexpected cross-origin failure: ${String(error)}`);
      pass();
    }
  } catch (error) {
    fail(error && error.message ? error.message : String(error));
  }
}

window.addEventListener("load", run);
</script>
</body>
</html>
